<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плейлист: Иришке</title>
    <style>
        body {
            background-color: #0c0205;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Главный контейнер */
        .player-container {
            width: 100%;
            max-width: 390px;
            background-color: #120307;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 42, 95, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ЗОНА С РОЗОЙ: Занимает фиксированную высоту, картинка точно отобразится */
        .cover-area {
            position: relative;
            width: 100%;
            height: 280px; /* Фиксированная высота для фото */
            background-image: url('cover.jpg'); /* Ваша роза из GitHub */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #20050d; /* Запасной цвет, если картинка долго грузится */
        }

        /* Плавное затемнение картинки к низу */
        .cover-area::after {
            content: '';
            position: absolute;
            left: 0; bottom: 0; right: 0;
            height: 50px;
            background: linear-gradient(to top, #120307, transparent);
        }

        /* Текст поверх розы */
        .header {
            position: absolute;
            top: 20px;
            left: 0; right: 0;
            text-align: center;
            z-index: 5;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
        }

        .header h1 {
            font-size: 26px;
            margin: 0 0 3px 0;
            color: #fff;
            font-weight: 800;
        }

        .header p {
            color: #dddddd;
            margin: 0;
            font-size: 12px;
            letter-spacing: 1px;
        }

        /* ЗОНА УПРАВЛЕНИЯ СНИЗУ */
        .controls-area {
            padding: 20px;
            display: flex;
            flex-direction: column;
            background: #120307;
        }

        .current-track-info {
            text-align: center;
            margin-bottom: 10px;
        }

        #current-title {
            font-size: 19px;
            font-weight: 700;
            margin: 0;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* ГОРИЗОНТАЛЬНЫЙ ЭКВАЛАЙЗЕР */
        .visualizer-area {
            width: 100%;
            height: 60px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 8px;
            box-sizing: border-box;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .bar {
            flex-grow: 1;
            margin: 0 1px;
            height: 4px; /* Стартовая высота */
            border-radius: 2px 2px 0 0;
            transition: height 0.1s ease;
        }

        /* Кнопки переключения */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            margin-bottom: 15px;
        }

        .btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 24px;
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.9);
        }

        .btn-play {
            background: linear-gradient(135deg, #ff4171, #d0003c);
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            box-shadow: 0 0 15px rgba(255, 42, 95, 0.4);
        }

        /* Полоса прогресса */
        .progress-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            color: #b3b3b3;
            margin-bottom: 15px;
        }

        .progress-bar-wrapper {
            flex-grow: 1;
            display: flex;
            align-items: center;
        }

        .progress-bar {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.1);
            height: 4px;
            border-radius: 2px;
            outline: none;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 5px #ff2a5f;
        }

        /* Громкость */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.02);
            padding: 6px 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .volume-slider {
            flex-grow: 1;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.1);
            height: 3px;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff2a5f;
        }

        /* Список треков */
        .playlist {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 130px;
            overflow-y: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 8px;
        }

        .track-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 4px;
            background-color: rgba(255, 255, 255, 0.01);
            font-size: 13px;
        }

        .track-item.active {
            background: linear-gradient(90deg, rgba(255, 42, 95, 0.2), transparent);
            border-left: 3px solid #ff2a5f;
        }

        .track-details h4 {
            margin: 0;
            font-size: 13px;
            font-weight: 500;
        }

        .track-duration {
            font-size: 11px;
            color: #aaaaaa;
        }
    </style>
</head>
<body>

<div class="player-container">
    
    <div class="cover-area">
        <div class="header">
            <h1>Иришке</h1>
            <p>AleksLebed • Suno Playlist</p>
        </div>
    </div>

    <div class="controls-area">
        <div class="current-track-info">
            <h3 id="current-title">Загрузка...</h3>
        </div>

        <div class="visualizer-area" id="visualizer"></div>

        <div class="controls">
            <button class="btn" id="btn-prev">⏮</button>
            <button class="btn btn-play" id="btn-play">▶</button>
            <button class="btn" id="btn-next">⏭</button>
        </div>

        <audio id="audio-player" src=""></audio>

        <div class="progress-container">
            <span id="time-current">0:00</span>
            <div class="progress-bar-wrapper">
                <input type="range" class="progress-bar" id="progress" min="0" max="100" value="0">
            </div>
            <span id="time-duration">0:00</span>
        </div>

        <div class="volume-container">
            <span>🔈</span>
            <input type="range" class="volume-slider" id="volume" min="0" max="1" step="0.05" value="0.7">
            <span>🔊</span>
        </div>

        <ul class="playlist" id="playlist-container"></ul>
    </div>
</div>

<script>
    const tracks = [
        { id: 1, title: "Заезженный диск", duration: "4:01", file: "track1.mp3" },
        { id: 2, title: "сумасшедший саксофон", duration: "4:39", file: "track2.mp3" },
        { id: 3, title: "Девчонка с картинки", duration: "3:53", file: "track3.mp3" },
        { id: 4, title: "танцы на битом стекле", duration: "3:12", file: "track4.mp3" }
    ];

    let currentTrackIndex = 0;
    let visualizerInterval;
    const numBars = 28; // Количество разноцветных полос
    
    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('btn-play');
    const prevBtn = document.getElementById('btn-prev');
    const nextBtn = document.getElementById('btn-next');
    const volumeSlider = document.getElementById('volume');
    const progressBar = document.getElementById('progress');
    const playlistContainer = document.getElementById('playlist-container');
    const visualizer = document.getElementById('visualizer');
    const currentTitle = document.getElementById('current-title');
    const timeCurrent = document.getElementById('time-current');
    const timeDuration = document.getElementById('time-duration');

    // Создаем разноцветные полосы
    function createVisualizer() {
        visualizer.innerHTML = '';
        for (let i = 0; i < numBars; i++) {
            const bar = document.createElement('div');
            bar.classList.add('bar');
            
            // Плавный переход цвета от бордового к фиолетовому и синему
            const hue = 330 + (i * (70 / numBars)); 
            bar.style.backgroundColor = `hsl(${hue}, 95%, 55%)`;
            bar.style.boxShadow = `0 0 4px hsl(${hue}, 95%, 50%)`;
            
            visualizer.appendChild(bar);
        }
    }

    function initPlaylist() {
        playlistContainer.innerHTML = '';
        tracks.forEach((track, index) => {
            const li = document.createElement('li');
            li.classList.add('track-item');
            if(index === currentTrackIndex) li.classList.add('active');
            
            li.innerHTML = `
                <div class="track-details">
                    <h4>${index + 1}. ${track.title}</h4>
                </div>
                <div class="track-duration">${track.duration}</div>
            `;
            
            li.addEventListener('click', () => loadAndPlayTrack(index));
            playlistContainer.appendChild(li);
        });
        loadTrack(currentTrackIndex);
    }

    function loadTrack(index) {
        currentTrackIndex = index;
        audio.src = tracks[index].file;
        currentTitle.innerText = tracks[index].title;
        timeDuration.innerText = tracks[index].duration;
        timeCurrent.innerText = "0:00";
        progressBar.value = 0;
        
        document.querySelectorAll('.track-item').forEach((item, i) => {
            item.classList.toggle('active', i === index);
        });
        resetVisualizer();
    }

    function loadAndPlayTrack(index) {
        loadTrack(index);
        playTrack();
    }

    function startVisualizer() {
        if (visualizerInterval) clearInterval(visualizerInterval);
        const bars = document.querySelectorAll('.bar');
        
        visualizerInterval = setInterval(() => {
            bars.forEach((bar) => {
                const randomHeight = Math.floor(Math.random() * 40) + 4;
                bar.style.height = `${randomHeight}px`;
            });
        }, 85);
    }

    function resetVisualizer() {
        if (visualizerInterval) clearInterval(visualizerInterval);
        const bars = document.querySelectorAll('.bar');
        bars.forEach(bar => {
            bar.style.height = '4px';
        });
    }

    function playTrack() {
        audio.play().then(() => {
            playBtn.innerText = '⏸';
            startVisualizer();
        }).catch(err => {
            // Запасной запуск анимации для теста
            playBtn.innerText = '⏸';
            startVisualizer();
        });
    }

    function pauseTrack() {
        audio.pause();
        playBtn.innerText = '▶';
        resetVisualizer();
    }

    playBtn.addEventListener('click', () => {
        if (audio.paused) playTrack(); else pauseTrack();
    });

    prevBtn.addEventListener('click', () => {
        let index = currentTrackIndex - 1;
        if (index < 0) index = tracks.length - 1;
        loadAndPlayTrack(index);
    });

    nextBtn.addEventListener('click', () => {
        let index = currentTrackIndex + 1;
        if (index >= tracks.length) index = 0;
        loadAndPlayTrack(index);
    });

    audio.addEventListener('ended', () => { nextBtn.click(); });

    audio.addEventListener('timeupdate', () => {
        if (audio.duration) {
            const pos = (audio.currentTime / audio.duration) * 100;
            progressBar.value = pos;
            let mins = Math.floor(audio.currentTime / 60);
            let secs = Math.floor(audio.currentTime % 60);
            if (secs < 10) secs = '0' + secs;
            timeCurrent.innerText = `${mins}:${secs}`;
        }
    });

    progressBar.addEventListener('input', () => {
        if (audio.duration) {
            audio.currentTime = (progressBar.value / 100) * audio.duration;
        }
    });

    volumeSlider.addEventListener('input', (e) => { audio.volume = e.target.value; });

    createVisualizer();
    initPlaylist();
    audio.volume = volumeSlider.value;
</script>

</body>
</html>
