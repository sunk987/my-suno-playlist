<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плейлист: Иришке</title>
    <style>
        body { background-color: #0c0205; color: #ffffff; font-family: sans-serif; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

        /* Ваш красивый плеер */
        .player-container { width: 100%; max-width: 390px; background: #1a050b; border-radius: 25px; padding: 20px; border: 1px solid #ff4171; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; z-index: 10; }
        .btn-play { background: #ff4171; border: none; padding: 15px 30px; border-radius: 30px; color: white; font-size: 18px; cursor: pointer; margin: 10px; }
        
        /* Зона игры под плеером */
        #game-area { width: 100%; height: 400px; position: relative; margin-top: 20px; border: 1px dashed rgba(255, 65, 113, 0.3); border-radius: 20px; }
        
        /* Сердечки */
        .heart { position: absolute; font-size: 30px; cursor: pointer; animation: flyUp 6s linear forwards; }
        @keyframes flyUp { from { bottom: 0; opacity: 1; } to { bottom: 100%; opacity: 0; } }
        .sparkle { position: absolute; pointer-events: none; font-size: 20px; animation: explode 0.5s ease-out forwards; }
        @keyframes explode { to { transform: scale(2); opacity: 0; } }
    </style>
</head>
<body>

<div class="player-container">
    <h1>Иришке</h1>
    <button class="btn-play" id="btn-play">▶ Play</button>
    <div>Поймано сердечек: <span id="score">0</span></div>
    <audio id="audio" src="track1.mp3"></audio>
</div>

<div id="game-area"></div>

<script>
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('btn-play');
    const scoreEl = document.getElementById('score');
    const gameArea = document.getElementById('game-area');
    let score = 0;
    let heartInterval;

    playBtn.onclick = () => {
        if (audio.paused) {
            audio.play();
            playBtn.innerText = "⏸ Pause";
            heartInterval = setInterval(spawnHeart, 1000);
        } else {
            audio.pause();
            playBtn.innerText = "▶ Play";
            clearInterval(heartInterval);
        }
    };

    function spawnHeart() {
        const heart = document.createElement('div');
        heart.innerHTML = '❤️';
        heart.className = 'heart';
        heart.style.left = Math.random() * 80 + '%';
        heart.onclick = (e) => {
            const s = document.createElement('div');
            s.innerHTML = '✨';
            s.className = 'sparkle';
            s.style.left = e.clientX + 'px';
            s.style.top = e.clientY + 'px';
            document.body.appendChild(s);
            setTimeout(() => s.remove(), 500);
            
            score++;
            scoreEl.innerText = score;
            heart.remove();
        };
        gameArea.appendChild(heart);
        setTimeout(() => heart.remove(), 6000);
    }
</script>
</body>
</html>
