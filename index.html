<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плейлист: Иришке</title>
    <style>
        body { background-color: #0c0205; color: #ffffff; font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 10px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; overflow: hidden; position: relative; }

        .score-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(255, 42, 95, 0.2); border: 1px solid rgba(255, 42, 95, 0.4); padding: 8px 18px; border-radius: 20px; font-size: 14px; font-weight: 600; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5); z-index: 9999; backdrop-filter: blur(5px); pointer-events: none; }
        .score-container.bump { transform: translateX(-50%) scale(1.15); border-color: rgba(255, 42, 95, 0.9); }
        #score-count { color: #ff4171; font-size: 18px; font-weight: 800; }

        .player-container { position: relative; width: 100%; max-width: 390px; background: #1a050a; border-radius: 25px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9); border: 1px solid rgba(255, 42, 95, 0.2); overflow: hidden; display: flex; flex-direction: column; z-index: 10; margin-top: 40px; }

        .header { padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        #menu-toggle { cursor: pointer; font-size: 24px; color: #ff4171; padding: 5px; user-select: none; }

        .controls-area { padding: 0 20px 20px 20px; }
        .visualizer-area { width: 100%; height: 50px; background: rgba(0,0,0,0.3); border-radius: 10px; display: flex; align-items: flex-end; padding: 5px; margin-bottom: 15px; }
        .bar { flex-grow: 1; margin: 0 1px; background: #ff4171; border-radius: 2px; }

        .controls { display: flex; justify-content: center; gap: 25px; margin-bottom: 15px; }
        .btn { background: none; border: none; color: #fff; cursor: pointer; font-size: 24px; }
        .btn-play { background: #ff4171; width: 50px; height: 50px; border-radius: 50%; }

        /* Плейлист - СКРЫВАЕМЫЙ БЛОК */
        .playlist-wrapper { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; background: rgba(0,0,0,0.4); }
        .playlist-wrapper.active { max-height: 200px; overflow-y: auto; border-top: 1px solid rgba(255,255,255,0.1); }
        .playlist { list-style: none; padding: 10px; margin: 0; }
        .track-item { display: flex; justify-content: space-between; padding: 8px; cursor: pointer; border-radius: 5px; font-size: 13px; }
        .track-item.active { background: rgba(255, 42, 95, 0.3); }

        .heart { position: absolute; color: rgba(255, 65, 113, 0.35); font-size: 26px; z-index: 999; animation: flyUp linear forwards; pointer-events: auto; cursor: pointer; }
        @keyframes flyUp { to { transform: translateY(-120vh); opacity: 0; } }
    </style>
</head>
<body>

<div class="score-container" id="score-box">Поймано сердечек: <span id="score-count">0</span></div>

<div class="player-container">
    <div class="header">
        <div>
            <h1 style="font-size: 22px; margin:0;">Иришке</h1>
            <p style="font-size: 11px; margin:0; opacity:0.7;">AleksLebed • Suno Playlist</p>
        </div>
        <div id="menu-toggle">☰</div>
    </div>

    <div class="controls-area">
        <h3 id="current-title" style="text-align:center; margin: 10px 0;">Загрузка...</h3>
        <div class="visualizer-area" id="visualizer"></div>
        <div class="controls">
            <button class="btn" id="btn-prev">⏮</button>
            <button class="btn btn-play" id="btn-play">▶</button>
            <button class="btn" id="btn-next">⏭</button>
        </div>
        <audio id="audio-player" src=""></audio>
    </div>

    <div class="playlist-wrapper" id="playlist-wrapper">
        <ul class="playlist" id="playlist-container"></ul>
    </div>
</div>

<script>
    const tracks = [
        { title: "Заезженный диск", file: "track1.mp3" },
        { title: "сумасшедший саксофон", file: "track2.mp3" },
        { title: "Девчонка с картинки", file: "track3.mp3" },
        { title: "танцы на битом стекле", file: "track4.mp3" }
    ];

    // Инициализация элементов
    const menuToggle = document.getElementById('menu-toggle');
    const playlistWrapper = document.getElementById('playlist-wrapper');
    const playlistContainer = document.getElementById('playlist-container');
    const playBtn = document.getElementById('btn-play');
    const audio = document.getElementById('audio-player');

    // Логика меню
    menuToggle.addEventListener('click', () => {
        playlistWrapper.classList.toggle('active');
    });

    // Отрисовка списка
    tracks.forEach((track, index) => {
        const li = document.createElement('li');
        li.className = 'track-item';
        li.innerHTML = `<span>${index + 1}. ${track.title}</span>`;
        li.addEventListener('click', () => {
            audio.src = track.file;
            audio.play();
            playBtn.innerText = '⏸';
        });
        playlistContainer.appendChild(li);
    });

    playBtn.addEventListener('click', () => {
        if (audio.paused) { audio.play(); playBtn.innerText = '⏸'; }
        else { audio.pause(); playBtn.innerText = '▶'; }
    });

    // (Здесь можно вернуть вашу логику визуализатора и сердечек из предыдущего кода)
</script>
</body>
</html>
