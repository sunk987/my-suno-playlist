<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плейлист: Иришке</title>
    <style>
        body { background-color: #0c0205; color: #fff; font-family: sans-serif; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        /* КРАСИВЫЙ ПЛЕЕР */
        .player-container { width: 100%; max-width: 390px; background: #1a050b; border-radius: 25px; padding: 20px; border: 1px solid #ff4171; box-shadow: 0 10px 30px rgba(255, 65, 113, 0.2); text-align: center; }
        .visualizer { display: flex; justify-content: space-between; align-items: flex-end; height: 40px; margin: 15px 0; }
        .bar { width: 8px; background: #ff4171; border-radius: 4px; transition: height 0.1s; }
        .btn { padding: 10px 20px; background: #ff4171; border: none; border-radius: 20px; color: white; cursor: pointer; font-weight: bold; }
        
        /* ЗОНА ИГРЫ */
        #game-area { width: 100%; max-width: 390px; height: 300px; position: relative; margin-top: 20px; border-top: 2px solid #ff4171; overflow: hidden; }
        .heart { position: absolute; font-size: 30px; cursor: pointer; animation: flyUp 6s linear forwards; }
        @keyframes flyUp { from { bottom: 0; opacity: 1; } to { bottom: 100%; opacity: 0; } }
        .sparkle { position: absolute; pointer-events: none; font-size: 20px; animation: explode 0.5s ease-out forwards; }
        @keyframes explode { to { transform: scale(2); opacity: 0; } }
    </style>
</head>
<body>

<div class="player-container">
    <h3 id="track-name">Заезженный диск</h3>
    <div class="visualizer" id="viz"></div>
    <button class="btn" id="btn-play">▶ Play</button>
    <div style="margin-top:10px;">Сердечек: <span id="score">0</span></div>
    <audio id="audio" src="track1.mp3"></audio>
</div>

<div id="game-area"></div>

<script>
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('btn-play');
    const scoreEl = document.getElementById('score');
    const gameArea = document.getElementById('game-area');
    const viz = document.getElementById('viz');
    let score = 0;
    let heartInterval;

    // Создаем столбики визуализатора
    for(let i=0; i<15; i++) {
        const bar = document.createElement('div');
        bar.className = 'bar';
        bar.style.height = '10px';
        viz.appendChild(bar);
    }

    playBtn.onclick = () => {
        if (audio.paused) {
            audio.play();
            playBtn.innerText = "⏸ Pause";
            heartInterval = setInterval(spawnHeart, 1000);
            animateViz();
        } else {
            audio.pause();
            playBtn.innerText = "▶ Play";
            clearInterval(heartInterval);
        }
    };

    function animateViz() {
        if (!audio.paused) {
            document.querySelectorAll('.bar').forEach(b => b.style.height = Math.random()*30 + 5 + 'px');
            setTimeout(animateViz, 150);
        }
    }

    function spawnHeart() {
        const heart = document.createElement('div');
        heart.innerHTML = '❤️';
        heart.className = 'heart';
        heart.style.left = Math.random() * 80 + '%';
        heart.onclick = (e) => {
            const s = document.createElement('div');
            s.innerHTML = '✨';
            s.className = 'sparkle';
            s.style.left = e.clientX + 'px';
            s.style.top = e.clientY + 'px';
            document.body.appendChild(s);
            setTimeout(() => s.remove(), 500);
            score++;
            scoreEl.innerText = score;
            heart.remove();
        };
        gameArea.appendChild(heart);
        setTimeout(() => heart.remove(), 6000);
    }
</script>
</body>
</html>
