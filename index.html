<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плейлист: Иришке</title>
    <style>
        :root {
            --accent-color: #ff2a5f; /* Яркий бордово-розовый неон */
            --text-color: #ffffff;
            --text-muted: #cccccc;
        }

        body {
            background-color: #0c0205;
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        /* Плеер с розой на весь экран */
        .player-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            border-radius: 30px;
            padding: 30px 20px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(255, 42, 95, 0.2);
            overflow: hidden;
            background-image: url('rose.jpg'); /* Локальный файл из вашего GitHub */
            background-size: cover;
            background-position: center;
        }

        /* Плотное красивое затемнение поверх розы, чтобы всё читалось */
        .player-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, rgba(12, 2, 5, 0.4) 0%, rgba(12, 2, 5, 0.85) 100%);
            z-index: 1;
        }

        .header, .visualizer-area, .current-track-info, .progress-container, .controls, .volume-container, .playlist {
            position: relative;
            z-index: 2;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 32px;
            margin: 0 0 4px 0;
            color: #fff;
            font-weight: 800;
            text-shadow: 0 2px 15px rgba(255, 42, 95, 0.6);
        }

        .header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 13px;
            letter-spacing: 1px;
        }

        /* Прозрачное окошко под эквалайзер */
        .visualizer-area {
            width: 100%;
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 20px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .visualizer {
            display: flex;
            align-items: flex-end;
            height: 45px;
            gap: 6px;
        }

        .bar {
            width: 5px;
            height: 6px;
            background-color: var(--accent-color);
            border-radius: 3px;
            transition: height 0.12s ease;
            box-shadow: 0 0 10px var(--accent-color);
        }

        .current-track-info {
            text-align: center;
            margin-bottom: 20px;
        }

        #current-title {
            font-size: 22px;
            font-weight: 700;
            margin: 0;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        /* Тонкая аккуратная полоса времени */
        .progress-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            font-size: 12px;
            color: #ddd;
        }

        .progress-bar-wrapper {
            flex-grow: 1;
            display: flex;
            align-items: center;
        }

        .progress-bar {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.2);
            height: 4px;
            border-radius: 2px;
            outline: none;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 8px var(--accent-color);
            cursor: pointer;
        }

        /* Кнопки */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-bottom: 25px;
        }

        .btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 26px;
            transition: transform 0.2s;
        }

        .btn-play {
            background: linear-gradient(135deg, #ff4171, #d0003c);
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            box-shadow: 0 0 20px rgba(255, 42, 95, 0.5);
        }

        /* Громкость */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 15px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .volume-slider {
            flex-grow: 1;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.15);
            height: 4px;
            border-radius: 2px;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-color);
        }

        /* Список */
        .playlist {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 180px;
            overflow-y: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 10px;
        }

        .track-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 5px;
            background-color: rgba(0, 0, 0, 0.2);
        }

        .track-item.active {
            background: linear-gradient(90deg, rgba(255, 42, 95, 0.3), transparent);
            border-left: 3px solid var(--accent-color);
        }

        .track-details h4 {
            margin: 0;
            font-size: 14px;
            font-weight: 500;
        }

        .track-duration {
            font-size: 11px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="player-container">
    <div class="header">
        <h1>Иришке</h1>
        <p>AleksLebed • Suno Playlist</p>
    </div>

    <div class="visualizer-area">
        <div class="visualizer" id="visualizer">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
    </div>

    <div class="current-track-info">
        <h3 id="current-title">Загрузка...</h3>
    </div>

    <audio id="audio-player" src=""></audio>

    <div class="progress-container">
        <span id="time-current">0:00</span>
        <div class="progress-bar-wrapper">
            <input type="range" class="progress-bar" id="progress" min="0" max="100" value="0">
        </div>
        <span id="time-duration">0:00</span>
    </div>

    <div class="controls">
        <button class="btn" id="btn-prev">⏮</button>
        <button class="btn btn-play" id="btn-play">▶</button>
        <button class="btn" id="btn-next">⏭</button>
    </div>

    <div class="volume-container">
        <span>🔈</span>
        <input type="range" class="volume-slider" id="volume" min="0" max="1" step="0.05" value="0.7">
        <span>🔊</span>
    </div>

    <ul class="playlist" id="playlist-container"></ul>
</div>

<script>
    const tracks = [
        { id: 1, title: "Заезженный диск", duration: "4:01", file: "track1.mp3" },
        { id: 2, title: "сумасшедший саксофон", duration: "4:39", file: "track2.mp3" },
        { id: 3, title: "Девчонка с картинки", duration: "3:53", file: "track3.mp3" },
        { id: 4, title: "танцы на битом стекле", duration: "3:12", file: "track4.mp3" }
    ];

    let currentTrackIndex = 0;
    let visualizerInterval;
    
    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('btn-play');
    const prevBtn = document.getElementById('btn-prev');
    const nextBtn = document.getElementById('btn-next');
    const volumeSlider = document.getElementById('volume');
    const progressBar = document.getElementById('progress');
    const playlistContainer = document.getElementById('playlist-container');
    const bars = document.querySelectorAll('.bar');
    const currentTitle = document.getElementById('current-title');
    const timeCurrent = document.getElementById('time-current');
    const timeDuration = document.getElementById('time-duration');

    function initPlaylist() {
        playlistContainer.innerHTML = '';
        tracks.forEach((track, index) => {
            const li = document.createElement('li');
            li.classList.add('track-item');
            if(index === currentTrackIndex) li.classList.add('active');
            
            li.innerHTML = `
                <div class="track-details">
                    <h4>${index + 1}. ${track.title}</h4>
                </div>
                <div class="track-duration">${track.duration}</div>
            `;
            
            li.addEventListener('click', () => loadAndPlayTrack(index));
            playlistContainer.appendChild(li);
        });
        loadTrack(currentTrackIndex);
    }

    function loadTrack(index) {
        currentTrackIndex = index;
        audio.src = tracks[index].file;
        currentTitle.innerText = tracks[index].title;
        timeDuration.innerText = tracks[index].duration;
        timeCurrent.innerText = "0:00";
        progressBar.value = 0;
        
        document.querySelectorAll('.track-item').forEach((item, i) => {
            item.classList.toggle('active', i === index);
        });
        resetVisualizer();
    }

    function loadAndPlayTrack(index) {
        loadTrack(index);
        playTrack();
    }

    function startVisualizer() {
        if (visualizerInterval) clearInterval(visualizerInterval);
        visualizerInterval = setInterval(() => {
            bars.forEach(bar => {
                const height = Math.floor(Math.random() * 32) + 6;
                bar.style.height = height + 'px';
            });
        }, 110);
    }

    function resetVisualizer() {
        if (visualizerInterval) clearInterval(visualizerInterval);
        bars.forEach(bar => {
            bar.style.height = '6px';
        });
    }

    function playTrack() {
        audio.play().then(() => {
            playBtn.innerText = '⏸';
            startVisualizer();
        }).catch(err => {
            console.log("Ожидание трека...");
        });
    }

    function pauseTrack() {
        audio.pause();
        playBtn.innerText = '▶';
        resetVisualizer();
    }

    playBtn.addEventListener('click', () => {
        if (audio.paused) playTrack(); else pauseTrack();
    });

    prevBtn.addEventListener('click', () => {
        let index = currentTrackIndex - 1;
        if (index < 0) index = tracks.length - 1;
        loadAndPlayTrack(index);
    });

    nextBtn.addEventListener('click', () => {
        let index = currentTrackIndex + 1;
        if (index >= tracks.length) index = 0;
        loadAndPlayTrack(index);
    });

    audio.addEventListener('ended', () => {
        nextBtn.click();
    });

    audio.addEventListener('timeupdate', () => {
        if (audio.duration) {
            const pos = (audio.currentTime / audio.duration) * 100;
            progressBar.value = pos;
            
            let mins = Math.floor(audio.currentTime / 60);
            let secs = Math.floor(audio.currentTime % 60);
            if (secs < 10) secs = '0' + secs;
            timeCurrent.innerText = `${mins}:${secs}`;
        }
    });

    progressBar.addEventListener('input', () => {
        if (audio.duration) {
            const newTime = (progressBar.value / 100) * audio.duration;
            audio.currentTime = newTime;
        }
    });

    volumeSlider.addEventListener('input', (e) => {
        audio.volume = e.target.value;
    });

    initPlaylist();
    audio.volume = volumeSlider.value;
</script>

</body>
</html>
