<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плейлист: Иришке</title>
    <style>
        body {
            background-color: #0c0205;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
            position: relative;
        }

        .score-container {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%) scale(1);
            background: rgba(255, 42, 95, 0.2);
            border: 1px solid rgba(255, 42, 95, 0.4);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 15px rgba(255, 42, 95, 0.3);
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 6px;
            user-select: none;
            transition: transform 0.1s ease, border-color 0.1s ease;
            backdrop-filter: blur(5px);
            pointer-events: none;
        }

        .score-container.bump {
            transform: translateX(-50%) scale(1.15);
            border-color: rgba(255, 42, 95, 0.9);
            background: rgba(255, 42, 95, 0.35);
        }

        #score-count {
            color: #ff4171;
            font-size: 16px;
            font-weight: 800;
            text-shadow: 0 0 8px rgba(255, 65, 113, 0.8);
        }

        .player-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            background-image: url('cover.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(255, 42, 95, 0.2);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            z-index: 10;
            height: 90vh;
            max-height: 750px;
            overflow: hidden;
        }

        .player-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, rgba(18, 3, 7, 0.4) 0%, rgba(18, 3, 7, 0.85) 100%);
            z-index: 1;
            pointer-events: none;
        }

        .top-bar {
            position: relative;
            z-index: 3;
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 15px 15px 8px 15px;
            background: rgba(12, 2, 5, 0.8);
            backdrop-filter: blur(10px);
        }

        .search-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 65, 113, 0.8);
            border-radius: 25px;
            color: #fff;
            padding: 12px 18px;
            font-size: 15px;
            backdrop-filter: blur(5px);
            outline: none;
            min-width: 0;
            box-shadow: 0 0 15px rgba(255, 42, 95, 0.4);
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
        }

        .search-btn {
            background: linear-gradient(135deg, #ff4171, #d0003c);
            border: none;
            color: #fff;
            font-size: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 42, 95, 0.6);
            flex-shrink: 0;
        }

        .menu-toggle {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            font-size: 22px;
            width: 44px;
            height: 44px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
            flex-shrink: 0;
        }

        .scrollable-content {
            position: relative;
            z-index: 2;
            flex: 1;
            overflow-y: auto;
            padding: 0 15px 10px 15px;
            display: flex;
            flex-direction: column;
        }

        .search-results {
            list-style: none;
            padding: 0;
            margin: 0 0 8px 0;
            flex-shrink: 0;
        }

        .search-results.hidden {
            display: none;
        }

        .search-result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 4px;
            background-color: rgba(0, 0, 0, 0.4);
            font-size: 13px;
            transition: background 0.2s;
            cursor: pointer;
        }

        .search-result-item:hover {
            background: rgba(255, 42, 95, 0.3);
        }

        .search-result-item .play-now {
            background: #ff4171;
            border: none;
            color: #fff;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
            flex-shrink: 0;
            font-weight: 600;
        }

        .compact-player {
            flex-shrink: 0;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 16px;
            padding: 12px 15px;
            margin-top: auto;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(5px);
        }

        .player-top-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .player-info {
            flex: 1;
            min-width: 0;
        }

        #current-title {
            font-size: 14px;
            font-weight: 600;
            margin: 0;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .visualizer-area {
            width: 100%;
            height: 35px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 5px;
            box-sizing: border-box;
            margin-bottom: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .bar {
            flex-grow: 1;
            margin: 0 1px;
            height: 3px;
            border-radius: 2px 2px 0 0;
            will-change: height;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            margin-bottom: 6px;
        }

        .btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 18px;
            transition: transform 0.1s;
            padding: 4px;
        }

        .btn-play {
            background: linear-gradient(135deg, #ff4171, #d0003c);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            box-shadow: 0 0 12px rgba(255, 42, 95, 0.5);
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 9px;
            color: #ccc;
            margin-bottom: 6px;
        }

        .progress-bar-wrapper {
            flex-grow: 1;
            display: flex;
            align-items: center;
        }

        .progress-bar {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.2);
            height: 3px;
            border-radius: 2px;
            outline: none;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 5px #ff2a5f;
        }

        .volume-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
        }

        .volume-slider {
            flex-grow: 1;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.2);
            height: 3px;
            border-radius: 2px;
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff2a5f;
        }

        #love-message {
            margin: 6px 0;
            padding: 6px 12px;
            background: rgba(255, 65, 113, 0.25);
            backdrop-filter: blur(8px);
            border-radius: 16px 16px 16px 4px;
            border: 1px solid rgba(255, 130, 160, 0.4);
            color: #fff0f5;
            font-size: 12px;
            font-style: italic;
            text-align: center;
            box-shadow: 0 0 10px rgba(255, 42, 95, 0.25);
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.5s ease, transform 0.5s ease;
            pointer-events: none;
            min-height: 16px;
        }

        #love-message.show {
            opacity: 1;
            transform: translateY(0);
        }

        .playlist-section {
            flex-shrink: 0;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            padding-top: 8px;
            margin-top: 8px;
            max-height: 120px;
            overflow-y: auto;
        }

        .playlist-section.hidden {
            display: none;
        }

        .playlist {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .track-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 2px;
            background-color: rgba(0, 0, 0, 0.3);
            font-size: 11px;
        }

        .track-item.active {
            background: linear-gradient(90deg, rgba(255, 42, 95, 0.35), transparent);
            border-left: 2px solid #ff2a5f;
        }

        .track-details h4 {
            margin: 0;
            font-size: 11px;
            font-weight: 500;
            color: #fff;
        }

        .track-duration {
            font-size: 10px;
            color: #ccc;
        }

        .heart {
            position: fixed;
            bottom: -50px;
            color: rgba(255, 65, 113, 0.4);
            font-size: 26px;
            user-select: none;
            pointer-events: auto;
            cursor: pointer;
            z-index: 999;
            animation: flyUp linear forwards;
            will-change: transform, opacity;
            padding: 15px;
            touch-action: manipulation;
        }

        @keyframes flyUp {
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-120vh) translateX(var(--random-x)) rotate(var(--random-rot)); opacity: 0; }
        }

        .sparkle {
            position: absolute;
            pointer-events: none;
            z-index: 1000;
            font-size: 14px;
            user-select: none;
            will-change: transform, opacity;
            animation: explode 0.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes explode {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--ex), var(--ey)) scale(0.3) rotate(var(--erot)); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="score-container" id="score-box">
    <span>Поймано ❤️:</span>
    <span id="score-count">0</span>
</div>

<div class="player-container">
    <div class="player-overlay"></div>

    <div class="top-bar">
        <input type="text" class="search-input" id="search-input" placeholder="🔍  Поиск музыки...">
        <button class="search-btn" id="search-btn">🔍</button>
        <button class="menu-toggle" id="menu-toggle" aria-label="Показать плейлист">☰</button>
    </div>

    <div class="scrollable-content">
        <ul class="search-results hidden" id="search-results"></ul>

        <div class="compact-player">
            <div class="player-top-row">
                <div class="player-info">
                    <h3 id="current-title">Выбери трек</h3>
                </div>
                <div class="controls">
                    <button class="btn" id="btn-prev">⏮</button>
                    <button class="btn btn-play" id="btn-play">▶</button>
                    <button class="btn" id="btn-next">⏭</button>
                </div>
            </div>

            <audio id="audio-player" crossorigin="anonymous" src="" preload="auto"></audio>

            <div class="visualizer-area" id="visualizer"></div>

            <div class="progress-container">
                <span id="time-current">0:00</span>
                <div class="progress-bar-wrapper">
                    <input type="range" class="progress-bar" id="progress" min="0" max="100" value="0">
                </div>
                <span id="time-duration">0:00</span>
            </div>

            <div class="volume-row">
                <span>🔈</span>
                <input type="range" class="volume-slider" id="volume" min="0" max="1" step="0.05" value="0.7">
                <span>🔊</span>
            </div>

            <div id="love-message"></div>
        </div>

        <div class="playlist-section hidden" id="playlist-section">
            <ul class="playlist" id="playlist-container"></ul>
        </div>
    </div>
</div>

<script>
    const defaultTracks = [
        { id: 1, title: "Заезженный диск", duration: "4:01", file: "track1.mp3" },
        { id: 2, title: "сумасшедший саксофон", duration: "4:39", file: "track2.mp3" },
        { id: 3, title: "Девчонка с картинки", duration: "3:53", file: "track3.mp3" },
        { id: 4, title: "танцы на битом стекле", duration: "3:12", file: "track4.mp3" }
    ];

    let tracks = [...defaultTracks];
    let currentTrackIndex = -1;
    const numBars = 32;
    let score = 0;
    let audioContextInitialized = false;

    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('btn-play');
    const prevBtn = document.getElementById('btn-prev');
    const nextBtn = document.getElementById('btn-next');
    const volumeSlider = document.getElementById('volume');
    const progressBar = document.getElementById('progress');
    const playlistContainer = document.getElementById('playlist-container');
    const playlistSection = document.getElementById('playlist-section');
    const visualizer = document.getElementById('visualizer');
    const currentTitle = document.getElementById('current-title');
    const timeCurrent = document.getElementById('time-current');
    const timeDuration = document.getElementById('time-duration');
    const scoreCount = document.getElementById('score-count');
    const scoreBox = document.getElementById('score-box');
    const menuToggle = document.getElementById('menu-toggle');
    const loveMessageEl = document.getElementById('love-message');
    const searchInput = document.getElementById('search-input');
    const searchBtn = document.getElementById('search-btn');
    const searchResults = document.getElementById('search-results');

    let audioContext = null;
    let analyser = null;
    let gainNode = null;
    let source = null;
    let animationFrameId = null;
    let heartInterval = null;
    let messageTimeout = null;

    const loveMessages = [
        "Ты сегодня выглядишь просто волшебно ✨",
        "У тебя невероятные глаза, в них можно смотреть бесконечно 👀💖",
        "Твоя улыбка освещает всё вокруг 😊",
        "Твои карие глаза — это что-то невероятное, в них можно утонуть 🍫👀",
        "Ты — девчонка-искорка, зажигаешь всё вокруг себя ✨🔥",
        "Твоя походка — это настоящее искусство, так легко и красиво 🚶‍♀️✨",
        "У тебя дикая, невероятная энергетика, которая заражает 🔥⚡",
        "Твои черты лица такие изящные и красивые, как произведение искусства 🎨",
        "Твоё присутствие — это наслаждение, хочется быть рядом всегда 🌹",
        "Ты очень красивая, и это видно без всяких слов 💖"
    ];

    // Поиск через несколько источников
    async function searchMusic(query) {
        searchResults.innerHTML = '<li style="padding:15px;color:#ccc;text-align:center;">🔍 Ищем...</li>';
        searchResults.classList.remove('hidden');

        try {
            // Пробуем SoundCloud API
            const scResponse = await fetch(`https://api.soundcloud.com/tracks?q=${encodeURIComponent(query)}&client_id=8d5ac48f&limit=15`);
            
            if (scResponse.ok) {
                const scData = await scResponse.json();
                if (scData && scData.length > 0) {
                    const tracks = scData.map(track => ({
                        title: track.title,
                        artist: track.user.username,
                        url: track.stream_url + '?client_id=8d5ac48f',
                        duration: Math.floor(track.duration / 1000)
                    }));
                    displaySearchResults(tracks);
                    return;
                }
            }
        } catch (e) {
            console.log('SoundCloud не ответил, пробуем другое...');
        }

        // Запасной вариант — поиск через бесплатный API
        try {
            const response = await fetch(`https://api.deezer.com/search?q=${encodeURIComponent(query)}&limit=15`);
            const data = await response.json();
            
            if (data.data && data.data.length > 0) {
                const tracks = data.data.map(track => ({
                    title: track.title,
                    artist: track.artist.name,
                    url: track.preview,
                    duration: track.duration
                }));
                displaySearchResults(tracks);
            } else {
                searchResults.innerHTML = '<li style="padding:15px;color:#ccc;text-align:center;">Ничего не найдено 😔</li>';
            }
        } catch (error) {
            searchResults.innerHTML = '<li style="padding:15px;color:#ccc;text-align:center;">Ошибка поиска 😔</li>';
        }
    }

    function displaySearchResults(results) {
        searchResults.innerHTML = '';

        results.forEach(track => {
            const li = document.createElement('li');
            li.classList.add('search-result-item');
            li.innerHTML = `
                <div style="flex:1;min-width:0;">
                    <div style="font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${track.title}</div>
                    <div style="font-size:11px;color:#ccc;">${track.artist} • ${formatTime(track.duration)}</div>
                </div>
                <button class="play-now" data-audio="${track.url}" data-title="${track.title}" data-artist="${track.artist}" data-duration="${track.duration}">▶ Играть</button>
            `;
            searchResults.appendChild(li);
        });

        document.querySelectorAll('.play-now').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const audioUrl = btn.dataset.audio;
                const title = btn.dataset.title;
                const artist = btn.dataset.artist;
                const duration = parseInt(btn.dataset.duration) || 0;

                const newTrack = {
                    id: Date.now(),
                    title: `${artist} - ${title}`,
                    duration: formatTime(duration),
                    file: audioUrl
                };

                // Добавляем в плейлист
                tracks.push(newTrack);
                initPlaylist();
                
                // Сразу играем
                loadAndPlayTrack(tracks.length - 1);
                
                searchResults.classList.add('hidden');
                searchInput.value = '';
            });
        });
    }

    function formatTime(seconds) {
        if (!seconds || seconds === 0) return '?:??';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' + secs : secs}`;
    }

    function performSearch() {
        const query = searchInput.value.trim();
        if (query) searchMusic(query);
    }

    searchBtn.addEventListener('click', performSearch);
    searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') performSearch();
    });

    document.addEventListener('click', (e) => {
        if (!e.target.closest('.search-results') && !e.target.closest('.top-bar')) {
            searchResults.classList.add('hidden');
        }
    });

    menuToggle.addEventListener('click', () => {
        playlistSection.classList.toggle('hidden');
        menuToggle.innerHTML = playlistSection.classList.contains('hidden') ? '☰' : '✕';
    });

    function createVisualizer() {
        visualizer.innerHTML = '';
        for (let i = 0; i < numBars; i++) {
            const bar = document.createElement('div');
            bar.classList.add('bar');
            const hue = 330 + (i * (70 / numBars));
            bar.style.backgroundColor = `hsl(${hue}, 95%, 55%)`;
            bar.style.boxShadow = `0 0 4px hsl(${hue}, 95%, 50%)`;
            bar.style.height = '3px';
            visualizer.appendChild(bar);
        }
    }

    function initAudioContext() {
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 64;
            gainNode = audioContext.createGain();
            gainNode.gain.value = volumeSlider.value;
            source = audioContext.createMediaElementSource(audio);
            source.connect(analyser);
            source.connect(gainNode);
            gainNode.connect(audioContext.destination);
            audioContextInitialized = true;
        }
    }

    function initPlaylist() {
        playlistContainer.innerHTML = '';
        tracks.forEach((track, index) => {
            const li = document.createElement('li');
            li.classList.add('track-item');
            if (index === currentTrackIndex) li.classList.add('active');
            li.innerHTML = `<div class="track-details"><h4>${index + 1}. ${track.title}</h4></div><div class="track-duration">${track.duration}</div>`;
            li.addEventListener('click', () => loadAndPlayTrack(index));
            playlistContainer.appendChild(li);
        });
    }

    function loadTrack(index) {
        if (index < 0 || index >= tracks.length) return;
        currentTrackIndex = index;
        audio.src = tracks[index].file;
        audio.load();
        currentTitle.innerText = tracks[index].title;
        timeDuration.innerText = tracks[index].duration;
        timeCurrent.innerText = "0:00";
        progressBar.value = 0;
        document.querySelectorAll('.track-item').forEach((item, i) => {
            item.classList.toggle('active', i === index);
        });
        resetVisualizerStyles();
    }

    function loadAndPlayTrack(index) {
        loadTrack(index);
        setTimeout(() => playTrack(), 200);
    }

    function renderVisualizer() {
        if (!analyser) return;
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        const bars = document.querySelectorAll('.bar');

        function draw() {
            animationFrameId = requestAnimationFrame(draw);
            analyser.getByteFrequencyData(dataArray);
            bars.forEach((bar, index) => {
                const value = dataArray[index] || 0;
                const percentHeight = (value / 255) * 30;
                const finalHeight = Math.max(3, percentHeight);
                bar.style.height = `${finalHeight}px`;
            });
        }
        draw();
    }

    function resetVisualizerStyles() {
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
        const bars = document.querySelectorAll('.bar');
        bars.forEach(bar => bar.style.height = '3px');
    }

    function createExplosion(x, y) {
        const icons = ['✨', '⭐', '🌸', '💖'];
        const sparkCount = 8;
        for (let i = 0; i < sparkCount; i++) {
            const spark = document.createElement('div');
            spark.classList.add('sparkle');
            spark.innerHTML = icons[Math.floor(Math.random() * icons.length)];
            spark.style.left = x + 'px';
            spark.style.top = y + 'px';
            const angle = Math.random() * Math.PI * 2;
            const distance = Math.random() * 60 + 40;
            spark.style.setProperty('--ex', Math.cos(angle) * distance + 'px');
            spark.style.setProperty('--ey', Math.sin(angle) * distance + 'px');
            spark.style.setProperty('--erot', (Math.random() * 360) + 'deg');
            document.body.appendChild(spark);
            setTimeout(() => spark.remove(), 500);
        }
    }

    function createHeart() {
        const heart = document.createElement('div');
        heart.classList.add('heart');
        heart.innerHTML = '❤️';
        heart.style.left = Math.random() * 85 + 'vw';
        const size = Math.random() * 12 + 18;
        heart.style.fontSize = size + 'px';
        const duration = Math.random() * 7 + 8;
        heart.style.animationDuration = duration + 's';
        heart.style.setProperty('--random-x', (Math.random() * 100 - 50) + 'px');
        heart.style.setProperty('--random-rot', (Math.random() * 80 - 40) + 'deg');

        function popHeart(e) {
            e.preventDefault();
            e.stopPropagation();
            if (heart.classList.contains('popped')) return;
            heart.classList.add('popped');
            const rect = heart.getBoundingClientRect();
            createExplosion(rect.left + rect.width / 2, rect.top + rect.height / 2);
            heart.remove();
            score++;
            scoreCount.innerText = score;
            scoreBox.classList.add('bump');
            setTimeout(() => scoreBox.classList.remove('bump'), 100);
        }

        heart.addEventListener('touchstart', popHeart, { passive: false });
        heart.addEventListener('mousedown', popHeart);
        document.body.appendChild(heart);
        setTimeout(() => { if (heart.parentNode) heart.remove(); }, duration * 1000);
    }

    function startHearts() {
        if (heartInterval) clearInterval(heartInterval);
        heartInterval = setInterval(createHeart, 500);
    }

    function stopHearts() {
        if (heartInterval) clearInterval(heartInterval);
    }

    function showLoveMessage() {
        const msg = loveMessages[Math.floor(Math.random() * loveMessages.length)];
        loveMessageEl.textContent = msg;
        loveMessageEl.classList.add('show');
        clearTimeout(messageTimeout);
        messageTimeout = setTimeout(() => loveMessageEl.classList.remove('show'), 4000);
    }

    function scheduleNextMessage() {
        const delay = Math.random() * 10000 + 15000;
        messageTimeout = setTimeout(() => {
            showLoveMessage();
            if (!audio.paused) scheduleNextMessage();
        }, delay);
    }

    function startLoveMessages() {
        clearTimeout(messageTimeout);
        messageTimeout = setTimeout(() => { showLoveMessage(); scheduleNextMessage(); }, 2000);
    }

    function stopLoveMessages() {
        clearTimeout(messageTimeout);
        loveMessageEl.classList.remove('show');
    }

    function playTrack() {
        if (currentTrackIndex < 0 || currentTrackIndex >= tracks.length) return;
        const playPromise = audio.play();
        if (playPromise !== undefined) {
            playPromise.then(() => {
                playBtn.innerText = '⏸';
                if (!audioContextInitialized) initAudioContext();
                renderVisualizer();
                startHearts();
                startLoveMessages();
            }).catch(error => {
                console.error('Ошибка воспроизведения:', error);
                playBtn.innerText = '▶';
            });
        }
    }

    function pauseTrack() {
        audio.pause();
        playBtn.innerText = '▶';
        resetVisualizerStyles();
        stopHearts();
        stopLoveMessages();
    }

    playBtn.addEventListener('click', () => {
        if (currentTrackIndex < 0) {
            if (tracks.length > 0) loadAndPlayTrack(0);
            return;
        }
        audio.paused ? playTrack() : pauseTrack();
    });

    prevBtn.addEventListener('click', () => {
        if (tracks.length === 0) return;
        let index = currentTrackIndex - 1;
        if (index < 0) index = tracks.length - 1;
        loadAndPlayTrack(index);
    });

    nextBtn.addEventListener('click', () => {
        if (tracks.length === 0) return;
        let index = currentTrackIndex + 1;
        if (index >= tracks.length) index = 0;
        loadAndPlayTrack(index);
    });

    audio.addEventListener('ended', () => {
        if (tracks.length === 0) return;
        let index = currentTrackIndex + 1;
        if (index >= tracks.length) index = 0;
        loadAndPlayTrack(index);
    });

    audio.addEventListener('timeupdate', () => {
        if (audio.duration) {
            progressBar.value = (audio.currentTime / audio.duration) * 100;
            let mins = Math.floor(audio.currentTime / 60);
            let secs = Math.floor(audio.currentTime % 60);
            timeCurrent.innerText = `${mins}:${secs < 10 ? '0' + secs : secs}`;
        }
    });

    progressBar.addEventListener('input', () => {
        if (audio.duration) audio.currentTime = (progressBar.value / 100) * audio.duration;
    });

    volumeSlider.addEventListener('input', (e) => {
        if (gainNode) gainNode.gain.value = e.target.value;
        else audio.volume = e.target.value;
    });

    createVisualizer();
    initPlaylist();
</script>
</body>
</html>
