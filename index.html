<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Плейлист для Иришки</title>
    <style>
        body { background: #0c0205; color: white; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .player-container { width: 90%; max-width: 390px; background: #1a050b; border: 1px solid #ff4171; border-radius: 20px; padding: 20px; margin-top: 20px; text-align: center; }
        .btn-play { background: #ff4171; border: none; padding: 15px 30px; border-radius: 30px; color: white; font-size: 18px; cursor: pointer; }
        
        #game-area { width: 100%; flex-grow: 1; position: relative; overflow: hidden; }
        .heart { position: absolute; font-size: 30px; cursor: pointer; animation: flyUp 6s linear forwards; }
        @keyframes flyUp { from { bottom: 0; opacity: 1; } to { bottom: 100%; opacity: 0; } }
    </style>
</head>
<body>

<div class="player-container">
    <h1>Иришке</h1>
    <button class="btn-play" id="btn-play">▶ Play</button>
    <div style="margin-top:10px;">Поймано сердечек: <span id="score">0</span></div>
    <audio id="audio" src="track1.mp3"></audio>
</div>

<div id="game-area"></div>

<script>
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('btn-play');
    const scoreEl = document.getElementById('score');
    const gameArea = document.getElementById('game-area');
    let score = 0;
    let gameInterval;

    playBtn.onclick = () => {
        if (audio.paused) {
            audio.play().catch(e => alert("Нажми на экран для запуска!"));
            playBtn.innerText = "⏸ Pause";
            gameInterval = setInterval(spawnHeart, 800);
        } else {
            audio.pause();
            playBtn.innerText = "▶ Play";
            clearInterval(gameInterval);
        }
    };

    function spawnHeart() {
        const heart = document.createElement('div');
        heart.innerHTML = '❤️';
        heart.className = 'heart';
        heart.style.left = Math.random() * 80 + 'vw';
        heart.onclick = () => {
            score++;
            scoreEl.innerText = score;
            heart.remove();
        };
        gameArea.appendChild(heart);
        setTimeout(() => heart.remove(), 6000);
    }
</script>
</body>
</html>
