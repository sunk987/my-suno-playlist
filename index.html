<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для Иришки</title>
    <style>
        body {
            background-color: #0c0205;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* ПЛЕЕР: Возвращаем нормальный размер */
        .player-container {
            width: 90%;
            max-width: 400px;
            background: #1a050b;
            border: 1px solid #ff4171;
            border-radius: 25px;
            padding: 25px;
            margin-top: 20px;
            text-align: center;
            z-index: 100; /* Плеер всегда сверху */
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .btn-play { 
            background: #ff4171; 
            border: none; 
            color: white; 
            padding: 15px 40px; 
            border-radius: 30px; 
            font-size: 20px; 
            cursor: pointer; 
            margin-top: 10px;
        }

        /* ИГРА: Сердечки теперь крупные */
        #game-area {
            width: 100%;
            flex-grow: 1;
            position: relative;
            z-index: 1;
        }

        .heart {
            position: absolute;
            font-size: 45px; /* СДЕЛАЛ КРУПНЕЕ (было 20) */
            color: #ff4171;
            cursor: pointer;
            animation: flyUp linear forwards;
            padding: 10px;
            transition: transform 0.1s;
        }

        .heart:active { transform: scale(1.3); }

        @keyframes flyUp {
            to { transform: translateY(-110vh); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="player-container">
    <h1>Иришке</h1>
    <button class="btn-play" id="btn-play">▶ Play</button>
    <div style="margin-top:15px; font-size: 18px;">
        Поймано сердечек: <span id="score-count" style="font-weight:bold; color:#ff4171;">0</span>
    </div>
    <audio id="audio-player" src="track1.mp3"></audio>
</div>

<div id="game-area"></div>

<script>
    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('btn-play');
    const scoreCount = document.getElementById('score-count');
    const gameArea = document.getElementById('game-area');
    let score = 0;
    let heartInterval;

    playBtn.onclick = () => {
        if (audio.paused) {
            audio.play();
            playBtn.innerText = '⏸ Pause';
            heartInterval = setInterval(createHeart, 1000); // Чуть реже, чтобы не перегружать экран
        } else {
            audio.pause();
            playBtn.innerText = '▶ Play';
            clearInterval(heartInterval);
        }
    };

    function createHeart() {
        const heart = document.createElement('div');
        heart.innerHTML = '❤️';
        heart.className = 'heart';
        
        // Появление в случайном месте (отступ 10% от краев)
        heart.style.left = (Math.random() * 80 + 10) + 'vw';
        
        // Размер: от 40px до 50px (реально крупные!)
        heart.style.fontSize = (Math.random() * 10 + 40) + 'px';
        
        // Скорость: летят плавно
        heart.style.animationDuration = (Math.random() * 4 + 6) + 's';

        heart.onclick = () => {
            score++;
            scoreCount.innerText = score;
            heart.remove();
        };

        gameArea.appendChild(heart);
        setTimeout(() => heart.remove(), 12000);
    }
</script>
</body>
</html>
