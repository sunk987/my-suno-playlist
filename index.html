<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плейлист для Иришки</title>
    <style>
        body {
            background-color: #0c0205;
            color: #ffffff;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Контейнер плеера */
        .player-container {
            width: 100%;
            max-width: 390px;
            background: #1a050b;
            border-radius: 25px;
            padding: 20px;
            border: 1px solid #ff4171;
            text-align: center;
        }

        /* Зона игры под плеером */
        #game-area {
            width: 100%;
            flex-grow: 1;
            position: relative;
            margin-top: 20px;
            border: 1px dashed rgba(255, 65, 113, 0.3);
            border-radius: 20px;
        }

        button { padding: 15px 30px; cursor: pointer; border-radius: 10px; border: none; background: #ff4171; color: white; font-weight: bold; }
    </style>
</head>
<body>

<div class="player-container">
    <h2 id="current-title">Иришке</h2>
    <button id="btn-play">▶ Play</button>
    <audio id="audio" src="track1.mp3"></audio>
</div>

<div id="game-area"></div>

<script>
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('btn-play');
    
    playBtn.onclick = () => {
        if (audio.paused) {
            audio.play();
            playBtn.innerText = "⏸ Pause";
        } else {
            audio.pause();
            playBtn.innerText = "▶ Play";
        }
    };
</script>
</body>
</html>
