<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плейлист: Иришке</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --container-bg: #14161d;
            --accent-color: #fca311;
            --accent-glow: #ff5400;
            --text-color: #f8f9fa;
            --text-muted: #8d99ae;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        .player-container {
            background-color: var(--container-bg);
            width: 100%;
            max-width: 480px;
            border-radius: 32px;
            padding: 30px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 10px 20px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            position: relative;
            z-index: 2;
        }

        .header h1 {
            font-size: 36px;
            margin: 0 0 8px 0;
            background: linear-gradient(45deg, #fca311, #ff5400);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 15px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Центральная неновая анимация ВМЕСТО картинки */
        .cover-area {
            width: 100%;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            position: relative;
        }

        .glow-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent-color) 10%, transparent 80%);
            opacity: 0.1;
            filter: blur(40px);
            position: absolute;
        }

        .playing .glow-circle {
            animation: pulse-glow 2s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.1; filter: blur(40px); }
            50% { opacity: 0.25; filter: blur(50px); }
        }

        .neon-bar-visualizer {
            display: flex;
            gap: 6px;
            align-items: center;
            height: 60px;
        }

        .neon-bar {
            width: 8px;
            height: 10px;
            background-color: var(--accent-color);
            border-radius: 10px;
            transition: all 0.1s ease;
            box-shadow: 0 0 10px rgba(252, 163, 17, 0.6);
        }

        .playing .neon-bar {
            animation: bounce-neon 0.8s ease-in-out infinite alternate;
        }

        .playing .neon-bar:nth-child(1) { animation-delay: 0.1s; height: 30px; }
        .playing .neon-bar:nth-child(2) { animation-delay: 0.3s; height: 50px; }
        .playing .neon-bar:nth-child(3) { animation-delay: 0.0s; height: 20px; }
        .playing .neon-bar:nth-child(4) { animation-delay: 0.4s; height: 60px; }
        .playing .neon-bar:nth-child(5) { animation-delay: 0.2s; height: 40px; }

        @keyframes bounce-neon {
            0% { height: 10px; box-shadow: 0 0 5px rgba(252, 163, 17, 0.5); }
            100% { height: 70px; box-shadow: 0 0 18px rgba(255, 84, 0, 0.9); }
        }

        /* Инфо */
        .current-track-info {
            text-align: center;
            margin-bottom: 20px;
            min-height: 50px;
        }

        #current-title {
            font-size: 26px;
            font-weight: 700;
            margin: 0;
            color: #fff;
            letter-spacing: 0.5px;
        }

        /* Прогресс-бар */
        .progress-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
            font-size: 13px;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        .progress-bar {
            flex-grow: 1;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.05);
            height: 7px;
            border-radius: 10px;
            outline: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 0;
            height: 0;
        }

        .progress-fill {
            position: absolute;
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), var(--accent-glow));
            border-radius: 10px;
            width: 0%;
            box-shadow: 0 0 10px rgba(252, 163, 17, 0.7);
        }

        /* Управление */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 35px;
            margin-bottom: 30px;
        }

        .btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 26px;
            transition: all 0.2s;
            padding: 10px;
            border-radius: 50%;
        }

        .btn:hover {
            color: var(--accent-color);
            transform: scale(1.15);
        }

        .btn-play {
            background: linear-gradient(135deg, var(--accent-color), var(--accent-glow));
            width: 65px;
            height: 65px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            box-shadow: 0 8px 25px rgba(252, 163, 17, 0.5), 0 0 10px rgba(255, 84, 0, 0.3);
            color: #101115;
            transition: all 0.3s;
        }

        .btn-play:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 10px 30px rgba(252, 163, 17, 0.7), 0 0 15px rgba(255, 84, 0, 0.5);
        }

        /* Громкость */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.02);
            padding: 10px 20px;
            border-radius: 16px;
        }

        .volume-slider {
            flex-grow: 1;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.05);
            height: 5px;
            border-radius: 3px;
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
            box-shadow: 0 0 5px rgba(252, 163, 17, 0.5);
        }

        /* Список треков */
        .playlist {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 250px;
            overflow-y: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 15px;
        }

        /* Скроллбар для списка */
        .playlist::-webkit-scrollbar {
            width: 6px;
        }
        .playlist::-webkit-scrollbar-track {
            background: transparent;
        }
        .playlist::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .track-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-radius: 16px;
            cursor: pointer;
            margin-bottom: 8px;
            transition: all 0.2s ease;
            background-color: transparent;
        }

        .track-item:hover {
            background-color: rgba(255, 255, 255, 0.03);
        }

        .track-item.active {
            background: linear-gradient(90deg, rgba(252, 163, 17, 0.12), rgba(255, 84, 0, 0.03));
            border-left: 4px solid var(--accent-color);
        }

        .track-details {
            flex: 1;
            padding-right: 15px;
        }

        .track-details h4 {
            margin: 0 0 4px 0;
            font-size: 17px;
            font-weight: 600;
            color: #fff;
        }

        .track-artist {
            margin: 0;
            font-size: 14px;
            color: var(--text-muted);
        }

        .track-duration {
            font-size: 14px;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="player-container" id="player">
    <div class="header">
        <h1>Иришке</h1>
        <p>AleksLebed • Suno Playlist</p>
    </div>

    <div class="cover-area">
        <div class="glow-circle"></div>
        <div class="neon-bar-visualizer">
            <div class="neon-bar"></div>
            <div class="neon-bar"></div>
            <div class="neon-bar"></div>
            <div class="neon-bar"></div>
            <div class="neon-bar"></div>
        </div>
    </div>

    <div class="current-track-info">
        <h3 id="current-title">Загрузка...</h3>
    </div>

    <audio id="audio-player" src=""></audio>

    <div class="progress-container">
        <span id="time-current">0:00</span>
        <div class="progress-bar-wrap">
            <div class="progress-fill" id="progress-fill"></div>
            <input type="range" class="progress-bar" id="progress" min="0" max="100" value="0">
        </div>
        <span id="time-duration">0:00</span>
    </div>

    <div class="controls">
        <button class="btn" id="btn-prev">⏮</button>
        <button class="btn btn-play" id="btn-play">▶</button>
        <button class="btn" id="btn-next">⏭</button>
    </div>

    <div class="volume-container">
        <span style="font-size: 14px; opacity: 0.6;">🔈</span>
        <input type="range" class="volume-slider" id="volume" min="0" max="1" step="0.05" value="0.7">
        <span style="font-size: 14px; opacity: 0.8;">🔊</span>
    </div>

    <ul class="playlist" id="playlist-container"></ul>
</div>

<script>
    const tracks = [
        { id: 1, title: "Заезженный диск", artist: "AleksLebed", duration: "4:01", file: "track1.mp3" },
        { id: 2, title: "сумасшедший саксофон", artist: "AleksLebed", duration: "4:39", file: "track2.mp3" },
        { id: 3, title: "Девчонка с картинки", artist: "AleksLebed", duration: "3:53", file: "track3.mp3" },
        { id: 4, title: "танцы на битом стекле", artist: "AleksLebed", duration: "3:12", file: "track4.mp3" }
    ];

    let currentTrackIndex = 0;
    const player = document.getElementById('player');
    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('btn-play');
    const prevBtn = document.getElementById('btn-prev');
    const nextBtn = document.getElementById('btn-next');
    const volumeSlider = document.getElementById('volume');
    const progressBar = document.getElementById('progress');
    const progressFill = document.getElementById('progress-fill');
    const playlistContainer = document.getElementById('playlist-container');
    const currentTitle = document.getElementById('current-title');
    const timeCurrent = document.getElementById('time-current');
    const timeDuration = document.getElementById('time-duration');

    function initPlaylist() {
        playlistContainer.innerHTML = '';
        tracks.forEach((track, index) => {
            const li = document.createElement('li');
            li.classList.add('track-item');
            if(index === currentTrackIndex) li.classList.add('active');
            
            li.innerHTML = `
                <div class="track-details">
                    <h4>${index + 1}. ${track.title}</h4>
                    <p class="track-artist">${track.artist}</p>
                </div>
                <div class="track-duration">${track.duration}</div>
            `;
            
            li.addEventListener('click', () => loadAndPlayTrack(index));
            playlistContainer.appendChild(li);
        });
        loadTrack(currentTrackIndex);
    }

    function loadTrack(index) {
        currentTrackIndex = index;
        audio.src = tracks[index].file;
        currentTitle.innerText = tracks[index].title;
        timeDuration.innerText = tracks[index].duration;
        timeCurrent.innerText = "0:00";
        progressFill.style.width = "0%";
        progressBar.value = 0;
        
        document.querySelectorAll('.track-item').forEach((item, i) => {
            item.classList.toggle('active', i === index);
        });
    }

    function loadAndPlayTrack(index) {
        loadTrack(index);
        playTrack();
    }

    function playTrack() {
        audio.play().then(() => {
            playBtn.innerText = '⏸';
            player.classList.add('playing');
        }).catch(err => {
            console.log("Файл " + tracks[currentTrackIndex].file + " не найден.");
        });
    }

    function pauseTrack() {
        audio.pause();
        playBtn.innerText = '▶';
        player.classList.remove('playing');
    }

    playBtn.addEventListener('click', () => {
        if (audio.paused) playTrack(); else pauseTrack();
    });

    prevBtn.addEventListener('click', () => {
        let index = currentTrackIndex - 1;
        if (index < 0) index = tracks.length - 1;
        loadAndPlayTrack(index);
    });

    nextBtn.addEventListener('click', () => {
        let index = currentTrackIndex + 1;
        if (index >= tracks.length) index = 0;
        loadAndPlayTrack(index);
    });

    audio.addEventListener('ended', () => {
        nextBtn.click();
    });

    audio.addEventListener('timeupdate', () => {
        if (audio.duration) {
            const pos = (audio.currentTime / audio.duration) * 100;
            progressBar.value = pos;
            progressFill.style.width = pos + '%';
            
            let mins = Math.floor(audio.currentTime / 60);
            let secs = Math.floor(audio.currentTime % 60);
            if (secs < 10) secs = '0' + secs;
            timeCurrent.innerText = `${mins}:${secs}`;
        }
    });

    progressBar.addEventListener('input', () => {
        if (audio.duration) {
            const newTime = (progressBar.value / 100) * audio.duration;
            audio.currentTime = newTime;
        }
    });

    volumeSlider.addEventListener('input', (e) => {
        audio.volume = e.target.value;
    });

    initPlaylist();
    audio.volume = volumeSlider.value;
</script>

</body>
    </html>
