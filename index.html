<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Иришке • Playlist</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#090104;
    font-family:'Segoe UI',sans-serif;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
    overflow:hidden;
}

/* Счетчик */

.score-container{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(255,42,95,0.15);
    border:1px solid rgba(255,42,95,0.35);
    border-radius:20px;
    padding:10px 20px;
    font-weight:600;
    backdrop-filter:blur(8px);
    z-index:999;
}

#score-count{
    color:#ff4171;
    font-size:22px;
    font-weight:800;
}

/* Плеер */

.player-container{
    width:100%;
    max-width:390px;
    border-radius:30px;
    overflow:hidden;
    position:relative;

    background:
    linear-gradient(rgba(0,0,0,0.55),
    rgba(0,0,0,0.65)),

    url('https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=1200&auto=format&fit=crop');

    background-size:cover;
    background-position:center;

    box-shadow:0 20px 60px rgba(0,0,0,0.8);

    border:1px solid rgba(255,255,255,0.08);
}

.player-content{
    padding:25px;
}

/* Верх */

.header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:20px;
}

.header h1{
    font-size:58px;
    font-weight:800;
}

.header p{
    opacity:0.7;
    font-size:15px;
}

/* Кнопка меню */

.menu-box{
    display:flex;
    justify-content:flex-end;
}

#menu-toggle{
    width:48px;
    height:48px;
    border:none;
    border-radius:14px;

    background:rgba(255,42,95,0.18);

    color:#ff4171;

    font-size:28px;

    cursor:pointer;

    transition:0.25s;
}

#menu-toggle:hover{
    transform:scale(1.08);
    background:rgba(255,42,95,0.3);
}

/* Название */

#current-title{
    text-align:center;
    font-size:22px;
    margin:20px 0;
    font-weight:700;
}

/* Визуализатор */

.visualizer-area{
    width:100%;
    height:60px;

    background:rgba(0,0,0,0.35);

    border-radius:14px;

    display:flex;
    align-items:flex-end;

    padding:5px;
    gap:3px;

    margin-bottom:25px;
}

.bar{
    flex:1;
    border-radius:4px;

    background:
    linear-gradient(to top,
    #ff2a5f,
    #ff9a3d);

    animation:bars 1s infinite ease-in-out alternate;
}

.bar:nth-child(odd){
    animation-duration:0.8s;
}

.bar:nth-child(even){
    animation-duration:1.3s;
}

@keyframes bars{

    from{
        height:15%;
    }

    to{
        height:100%;
    }

}

/* Кнопки */

.controls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:25px;

    margin-bottom:20px;
}

.btn{
    border:none;
    background:none;
    color:white;
    cursor:pointer;
    font-size:28px;
}

.btn-play{
    width:75px;
    height:75px;

    border-radius:50%;

    background:
    linear-gradient(135deg,
    #ff2a5f,
    #ff5d8f);

    box-shadow:
    0 0 25px rgba(255,42,95,0.5);

    font-size:32px;
}

/* Прогресс */

.progress-container{
    display:flex;
    align-items:center;
    gap:10px;

    margin-bottom:20px;
}

.progress{
    flex:1;
    height:5px;

    background:rgba(255,255,255,0.2);

    border-radius:10px;
    overflow:hidden;
}

.progress-filled{
    width:0%;
    height:100%;

    background:#ff4171;
}

/* Плейлист скрыт */

.playlist-wrapper{
    display:none;

    margin-top:15px;

    background:rgba(0,0,0,0.45);

    border-radius:18px;

    overflow:hidden;

    border:1px solid rgba(255,255,255,0.06);
}

/* Когда открыт */

.playlist-wrapper.show{
    display:block;
    animation:fadeMenu 0.3s ease;
}

@keyframes fadeMenu{

    from{
        opacity:0;
        transform:translateY(-10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.playlist{
    list-style:none;
}

.track-item{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:15px;

    cursor:pointer;

    transition:0.2s;

    border-bottom:
    1px solid rgba(255,255,255,0.05);
}

.track-item:hover{
    background:rgba(255,255,255,0.05);
}

.track-item.active{
    background:rgba(255,42,95,0.22);
}

/* Сердечки */

.heart{
    position:absolute;
    color:rgba(255,65,113,0.45);

    font-size:24px;

    animation:flyUp linear forwards;

    pointer-events:none;
}

@keyframes flyUp{

    to{
        transform:translateY(-120vh);
        opacity:0;
    }

}

</style>
</head>

<body>

<div class="score-container">
    Поймано сердечек:
    <span id="score-count">0</span>
</div>

<div class="player-container">

<div class="player-content">

    <!-- Верх -->

    <div class="header">

        <div>
            <h1>Иришке</h1>

            <p>
                AleksLebed • Suno Playlist
            </p>
        </div>

        <!-- ТРИ ПОЛОСКИ -->

        <div class="menu-box">

            <button id="menu-toggle">
                ☰
            </button>

        </div>

    </div>

    <!-- Название -->

    <h2 id="current-title">
        Заезженный диск
    </h2>

    <!-- Визуализатор -->

    <div class="visualizer-area" id="visualizer"></div>

    <!-- Кнопки -->

    <div class="controls">

        <button class="btn" id="btn-prev">
            ⏮
        </button>

        <button class="btn btn-play" id="btn-play">
            ▶
        </button>

        <button class="btn" id="btn-next">
            ⏭
        </button>

    </div>

    <!-- Прогресс -->

    <div class="progress-container">

        <span id="current-time">
            0:00
        </span>

        <div class="progress">

            <div class="progress-filled"
            id="progress-filled"></div>

        </div>

        <span id="duration">
            4:01
        </span>

    </div>

    <!-- Аудио -->

    <audio id="audio-player"></audio>

    <!-- СКРЫТЫЙ ПЛЕЙЛИСТ -->

    <div class="playlist-wrapper"
    id="playlist-wrapper">

        <ul class="playlist"
        id="playlist-container"></ul>

    </div>

</div>
</div>

<script>

/* Треки */

const tracks = [

{
title:"Заезженный диск",
file:"track1.mp3",
duration:"4:01"
},

{
title:"сумасшедший саксофон",
file:"track2.mp3",
duration:"4:39"
},

{
title:"Девчонка с картинки",
file:"track3.mp3",
duration:"3:53"
},

{
title:"танцы на битом стекле",
file:"track4.mp3",
duration:"3:12"
}

];

/* Элементы */

const audio =
document.getElementById('audio-player');

const playBtn =
document.getElementById('btn-play');

const prevBtn =
document.getElementById('btn-prev');

const nextBtn =
document.getElementById('btn-next');

const currentTitle =
document.getElementById('current-title');

const playlistContainer =
document.getElementById('playlist-container');

const menuToggle =
document.getElementById('menu-toggle');

const playlistWrapper =
document.getElementById('playlist-wrapper');

const progressFilled =
document.getElementById('progress-filled');

const currentTime =
document.getElementById('current-time');

const duration =
document.getElementById('duration');

/* Текущий трек */

let currentTrack = 0;

/* Визуализатор */

const visualizer =
document.getElementById('visualizer');

for(let i=0;i<35;i++){

    const bar =
    document.createElement('div');

    bar.classList.add('bar');

    bar.style.height =
    Math.random()*100+'%';

    visualizer.appendChild(bar);

}

/* КНОПКА ТРИ ПОЛОСКИ */

menuToggle.addEventListener('click',()=>{

    playlistWrapper.classList.toggle('show');

});

/* Создание плейлиста */

tracks.forEach((track,index)=>{

    const li =
    document.createElement('li');

    li.classList.add('track-item');

    li.innerHTML=`

    <span>
    ${index+1}. ${track.title}
    </span>

    <span>
    ${track.duration}
    </span>

    `;

    li.addEventListener('click',()=>{

        loadTrack(index);

        audio.play();

        playBtn.innerHTML='⏸';

    });

    playlistContainer.appendChild(li);

});

/* Загрузка трека */

function loadTrack(index){

    currentTrack=index;

    audio.src=
    tracks[index].file;

    currentTitle.innerText=
    tracks[index].title;

    duration.innerText=
    tracks[index].duration;

    updatePlaylist();

}

/* Активный трек */

function updatePlaylist(){

document
.querySelectorAll('.track-item')

.forEach((item,index)=>{

item.classList.toggle(
'active',
index===currentTrack
);

});

}

/* PLAY */

playBtn.addEventListener('click',()=>{

    if(audio.paused){

        audio.play();

        playBtn.innerHTML='⏸';

    }else{

        audio.pause();

        playBtn.innerHTML='▶';

    }

});

/* NEXT */

nextBtn.addEventListener('click',()=>{

    currentTrack++;

    if(currentTrack>=tracks.length){

        currentTrack=0;

    }

    loadTrack(currentTrack);

    audio.play();

    playBtn.innerHTML='⏸';

});

/* PREV */

prevBtn.addEventListener('click',()=>{

    currentTrack--;

    if(currentTrack<0){

        currentTrack=
        tracks.length-1;

    }

    loadTrack(currentTrack);

    audio.play();

    playBtn.innerHTML='⏸';

});

/* Прогресс */

audio.addEventListener('timeupdate',()=>{

if(audio.duration){

const progress=
(audio.currentTime/
audio.duration)*100;

progressFilled.style.width=
progress+'%';

let minutes=
Math.floor(audio.currentTime/60);

let seconds=
Math.floor(audio.currentTime%60);

if(seconds<10){

seconds='0'+seconds;

}

currentTime.innerText=
`${minutes}:${seconds}`;

}

});

/* Автоследующий */

audio.addEventListener('ended',()=>{

    nextBtn.click();

});

/* Старт */

loadTrack(0);

</script>

</body>
</html>
