<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Плейлист: Иришке</title>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: #0c0205;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            box-sizing: border-box;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .player-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-image: url('cover.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 0;
            box-shadow: none;
            border: none;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            z-index: 10;
            overflow: hidden;
        }

        .player-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, rgba(18, 3, 7, 0.2) 0%, rgba(18, 3, 7, 0.7) 100%);
            z-index: 1;
            pointer-events: none;
        }

        .draggable {
            position: absolute;
            cursor: grab;
            touch-action: none;
            transition: box-shadow 0.2s;
            z-index: 100;
        }

        .draggable:active {
            cursor: grabbing;
        }

        .draggable.dragging {
            cursor: grabbing;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 20px rgba(255, 42, 95, 0.4);
            z-index: 200;
        }

        .score-container {
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 42, 95, 0.25);
            border: 1px solid rgba(255, 42, 95, 0.5);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 6px;
            pointer-events: auto;
            white-space: nowrap;
        }

        .score-container.dragging {
            transform: none;
        }

        #score-count {
            color: #ff4171;
            font-size: 18px;
            font-weight: 800;
            text-shadow: 0 0 8px rgba(255, 65, 113, 0.8);
        }

        .bump-animation {
            animation: bump 0.15s ease;
        }

        @keyframes bump {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        #love-message {
            top: 70px;
            left: 20px;
            max-width: calc(100vw - 40px);
            padding: 14px 18px;
            background: rgba(255, 65, 113, 0.35);
            backdrop-filter: blur(15px);
            border-radius: 20px 20px 20px 4px;
            border: 1px solid rgba(255, 130, 160, 0.5);
            color: #fff0f5;
            font-size: 17px;
            font-style: italic;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-align: center;
            box-shadow: 0 0 25px rgba(255, 42, 95, 0.3);
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.6s ease, transform 0.6s ease;
            pointer-events: auto;
            min-height: 24px;
            line-height: 1.5;
            right: auto;
            min-width: 200px;
        }

        #love-message.show {
            opacity: 1;
            transform: translateY(0);
        }

        .menu-toggle {
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            font-size: 24px;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            backdrop-filter: blur(10px);
            transition: background 0.2s;
            left: auto;
            bottom: auto;
        }

        .menu-toggle:active {
            cursor: grabbing;
            background: rgba(255, 42, 95, 0.4);
        }

        .compact-player {
            bottom: 100px;
            left: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 22px;
            padding: 18px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            max-width: 500px;
            min-width: 300px;
            top: auto;
        }

        .compact-player.dragging {
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 42, 95, 0.6);
        }

        .drag-handle {
            width: 40px;
            height: 5px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            margin: 0 auto 12px auto;
            pointer-events: none;
        }

        .player-top-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .player-info {
            flex: 1;
            min-width: 0;
        }

        #current-title {
            font-size: 17px;
            font-weight: 600;
            margin: 0;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .visualizer-area {
            width: 100%;
            height: 50px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 14px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 6px;
            box-sizing: border-box;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .bar {
            flex-grow: 1;
            margin: 0 1px;
            height: 3px;
            border-radius: 2px 2px 0 0;
            will-change: height;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            margin-bottom: 12px;
        }

        .btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 22px;
            transition: transform 0.1s;
            padding: 6px;
            touch-action: manipulation;
        }

        .btn:active {
            transform: scale(0.9);
        }

        .btn-play {
            background: linear-gradient(135deg, #ff4171, #d0003c);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            box-shadow: 0 0 20px rgba(255, 42, 95, 0.6);
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: #ccc;
            margin-bottom: 10px;
        }

        .progress-bar-wrapper {
            flex-grow: 1;
            display: flex;
            align-items: center;
        }

        .progress-bar {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.25);
            height: 4px;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 8px #ff2a5f;
            cursor: pointer;
        }

        .volume-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .volume-slider {
            flex-grow: 1;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.25);
            height: 4px;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff2a5f;
            cursor: pointer;
        }

        .playlist-section {
            position: absolute;
            bottom: 100px;
            left: 15px;
            right: 15px;
            z-index: 150;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 22px;
            padding: 10px 0;
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: none;
            top: auto;
        }

        .playlist-section:not(.hidden) {
            display: block;
        }

        .playlist {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .track-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            cursor: pointer;
            background-color: transparent;
            font-size: 13px;
            transition: background 0.15s;
        }

        .track-item:active {
            background: rgba(255, 42, 95, 0.3);
        }

        .track-item.active {
            background: rgba(255, 42, 95, 0.4);
            border-left: 3px solid #ff2a5f;
        }

        .track-details h4 {
            margin: 0;
            font-size: 13px;
            font-weight: 500;
            color: #fff;
        }

        .track-duration {
            font-size: 12px;
            color: #ccc;
        }

        .heart {
            position: fixed;
            bottom: -30px;
            color: rgba(255, 65, 113, 0.5);
            font-size: 30px;
            user-select: none;
            pointer-events: auto;
            cursor: pointer;
            z-index: 999;
            animation: flyUp linear forwards;
            will-change: transform;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            padding: 25px;
            margin: -25px;
        }

        @keyframes flyUp {
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
            5% { opacity: 1; }
            95% { opacity: 1; }
            100% { transform: translateY(-110vh) translateX(var(--random-x)) rotate(var(--random-rot)); opacity: 0; }
        }

        .sparkle {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            font-size: 16px;
            user-select: none;
            will-change: transform, opacity;
            animation: explode 0.4s ease-out forwards;
        }

        @keyframes explode {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--ex), var(--ey)) scale(0) rotate(var(--erot)); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="player-container">
    <div class="player-overlay"></div>

    <div class="score-container draggable" id="score-box">
        <span>Поймано ❤️:</span>
        <span id="score-count">0</span>
    </div>

    <div class="draggable" id="love-message"></div>

    <button class="menu-toggle draggable" id="menu-toggle" aria-label="Показать плейлист">☰</button>

    <div class="compact-player draggable" id="draggable-player">
        <div class="drag-handle"></div>
        
        <div class="player-top-row">
            <div class="player-info">
                <h3 id="current-title">Выбери трек</h3>
            </div>
            <div class="controls">
                <button class="btn" id="btn-prev">⏮</button>
                <button class="btn btn-play" id="btn-play">▶</button>
                <button class="btn" id="btn-next">⏭</button>
            </div>
        </div>

        <audio id="audio-player" crossorigin="anonymous" src="" preload="auto"></audio>

        <div class="visualizer-area" id="visualizer"></div>

        <div class="progress-container">
            <span id="time-current">0:00</span>
            <div class="progress-bar-wrapper">
                <input type="range" class="progress-bar" id="progress" min="0" max="100" value="0">
            </div>
            <span id="time-duration">0:00</span>
        </div>

        <div class="volume-row">
            <span>🔈</span>
            <input type="range" class="volume-slider" id="volume" min="0" max="1" step="0.05" value="0.7">
            <span>🔊</span>
        </div>
    </div>

    <div class="playlist-section hidden" id="playlist-section">
        <ul class="playlist" id="playlist-container"></ul>
    </div>
</div>

<script>
    // 9 ПЕСЕН
    const tracks = [
        { id: 1, title: "Заезженный диск", duration: "4:01", file: "track1.mp3" },
        { id: 2, title: "сумасшедший саксофон", duration: "4:39", file: "track2.mp3" },
        { id: 3, title: "Девчонка с картинки", duration: "3:53", file: "track3.mp3" },
        { id: 4, title: "танцы на битом стекле", duration: "3:12", file: "track4.mp3" },
        { id: 5, title: "Километры сна", duration: "3:27", file: "track5.mp3" },
        { id: 6, title: "Капкан", duration: "3:56", file: "track6.mp3" },
        { id: 7, title: "Сотни тысяч роз", duration: "3:53", file: "track7.mp3" },
        { id: 8, title: "Три часа ночи", duration: "4:45", file: "track8.mp3" },
        { id: 9, title: "Голод внутри", duration: "4:14", file: "track9.mp3" }
    ];

    let currentTrackIndex = -1;
    const numBars = 32;
    let score = 0;
    let audioContextInitialized = false;

    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('btn-play');
    const prevBtn = document.getElementById('btn-prev');
    const nextBtn = document.getElementById('btn-next');
    const volumeSlider = document.getElementById('volume');
    const progressBar = document.getElementById('progress');
    const playlistContainer = document.getElementById('playlist-container');
    const playlistSection = document.getElementById('playlist-section');
    const visualizer = document.getElementById('visualizer');
    const currentTitle = document.getElementById('current-title');
    const timeCurrent = document.getElementById('time-current');
    const timeDuration = document.getElementById('time-duration');
    const scoreCount = document.getElementById('score-count');
    const scoreBox = document.getElementById('score-box');
    const menuToggle = document.getElementById('menu-toggle');
    const loveMessageEl = document.getElementById('love-message');

    let audioContext = null;
    let analyser = null;
    let gainNode = null;
    let source = null;
    let animationFrameId = null;
    let heartInterval = null;
    let messageTimeout = null;
    let heartPool = [];
    const MAX_HEARTS = 10;

    function initDraggable(element) {
        let isDragging = false;
        let startX, startY, startLeft, startTop;

        element.addEventListener('mousedown', startDrag);
        element.addEventListener('touchstart', startDrag, { passive: false });

        function startDrag(e) {
            if (e.target.closest('button:not(.menu-toggle)') || e.target.closest('input')) return;
            isDragging = true;
            element.classList.add('dragging');
            const touch = e.touches ? e.touches[0] : e;
            startX = touch.clientX;
            startY = touch.clientY;
            const rect = element.getBoundingClientRect();
            startLeft = rect.left;
            startTop = rect.top;
            element.style.transform = 'none';
            element.style.left = startLeft + 'px';
            element.style.top = startTop + 'px';
            element.style.right = 'auto';
            element.style.bottom = 'auto';
            e.preventDefault();
            e.stopPropagation();
        }

        function drag(e) {
            if (!isDragging) return;
            const touch = e.touches ? e.touches[0] : e;
            const dx = touch.clientX - startX;
            const dy = touch.clientY - startY;
            let newLeft = startLeft + dx;
            let newTop = startTop + dy;
            const maxLeft = window.innerWidth - element.offsetWidth;
            const maxTop = window.innerHeight - element.offsetHeight;
            newLeft = Math.max(0, Math.min(newLeft, maxLeft));
            newTop = Math.max(0, Math.min(newTop, maxTop));
            element.style.left = newLeft + 'px';
            element.style.top = newTop + 'px';
            e.preventDefault();
        }

        function endDrag(e) {
            if (!isDragging) return;
            isDragging = false;
            element.classList.remove('dragging');
            if (element === menuToggle) {
                const touch = e.changedTouches ? e.changedTouches[0] : e;
                const dx = Math.abs(touch.clientX - startX);
                const dy = Math.abs(touch.clientY - startY);
                if (dx < 10 && dy < 10) togglePlaylist();
            }
        }

        document.addEventListener('mousemove', drag);
        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchmove', drag, { passive: false });
        document.addEventListener('touchend', endDrag);
    }

    document.querySelectorAll('.draggable').forEach(el => initDraggable(el));

    function togglePlaylist() {
        playlistSection.classList.toggle('hidden');
        menuToggle.innerHTML = playlistSection.classList.contains('hidden') ? '☰' : '✕';
    }

    const loveMessages = [
        "Ты сегодня выглядишь просто волшебно ✨",
        "У тебя невероятные глаза, в них можно смотреть бесконечно 👀💖",
        "Твоя улыбка освещает всё вокруг 😊",
        "Твои карие глаза — это что-то невероятное, в них можно утонуть 🍫👀",
        "Ты — девчонка-искорка, зажигаешь всё вокруг себя ✨🔥",
        "Твоя походка — это настоящее искусство, так легко и красиво 🚶‍♀️✨",
        "У тебя дикая, невероятная энергетика, которая заражает 🔥⚡",
        "Твои черты лица такие изящные и красивые, как произведение искусства 🎨",
        "Твоё присутствие — это наслаждение, хочется быть рядом всегда 🌹",
        "Ты очень красивая, и это видно без всяких слов 💖"
    ];

    function createVisualizer() {
        visualizer.innerHTML = '';
        for (let i = 0; i < numBars; i++) {
            const bar = document.createElement('div');
            bar.classList.add('bar');
            const hue = 330 + (i * (70 / numBars));
            bar.style.backgroundColor = `hsl(${hue}, 95%, 55%)`;
            bar.style.boxShadow = `0 0 4px hsl(${hue}, 95%, 50%)`;
            bar.style.height = '3px';
            visualizer.appendChild(bar);
        }
    }

    function initAudioContext() {
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 64;
            gainNode = audioContext.createGain();
            gainNode.gain.value = volumeSlider.value;
            source = audioContext.createMediaElementSource(audio);
            source.connect(analyser);
            source.connect(gainNode);
            gainNode.connect(audioContext.destination);
            audioContextInitialized = true;
        }
    }

    function initPlaylist() {
        playlistContainer.innerHTML = '';
        tracks.forEach((track, index) => {
            const li = document.createElement('li');
            li.classList.add('track-item');
            if (index === currentTrackIndex) li.classList.add('active');
            li.innerHTML = `<div class="track-details"><h4>${index + 1}. ${track.title}</h4></div><div class="track-duration">${track.duration}</div>`;
            li.addEventListener('click', () => loadAndPlayTrack(index));
            playlistContainer.appendChild(li);
        });
    }

    function loadTrack(index) {
        if (index < 0 || index >= tracks.length) return;
        currentTrackIndex = index;
        audio.src = tracks[index].file;
        audio.load();
        currentTitle.innerText = tracks[index].title;
        timeDuration.innerText = tracks[index].duration;
        timeCurrent.innerText = "0:00";
        progressBar.value = 0;
        document.querySelectorAll('.track-item').forEach((item, i) => {
            item.classList.toggle('active', i === index);
        });
        resetVisualizerStyles();
    }

    function loadAndPlayTrack(index) {
        loadTrack(index);
        setTimeout(() => playTrack(), 200);
    }

    function renderVisualizer() {
        if (!analyser) return;
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        const bars = document.querySelectorAll('.bar');

        function draw() {
            animationFrameId = requestAnimationFrame(draw);
            analyser.getByteFrequencyData(dataArray);
            bars.forEach((bar, index) => {
                const value = dataArray[index] || 0;
                const percentHeight = (value / 255) * 40;
                const finalHeight = Math.max(3, percentHeight);
                bar.style.height = `${finalHeight}px`;
            });
        }
        draw();
    }

    function resetVisualizerStyles() {
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
        const bars = document.querySelectorAll('.bar');
        bars.forEach(bar => bar.style.height = '3px');
    }

    function createExplosion(x, y) {
        const icons = ['✨', '⭐', '💖'];
        for (let i = 0; i < 5; i++) {
            const spark = document.createElement('div');
            spark.classList.add('sparkle');
            spark.innerHTML = icons[Math.floor(Math.random() * icons.length)];
            spark.style.left = x + 'px';
            spark.style.top = y + 'px';
            const angle = Math.random() * Math.PI * 2;
            const distance = Math.random() * 40 + 20;
            spark.style.setProperty('--ex', Math.cos(angle) * distance + 'px');
            spark.style.setProperty('--ey', Math.sin(angle) * distance + 'px');
            spark.style.setProperty('--erot', (Math.random() * 180 - 90) + 'deg');
            document.body.appendChild(spark);
            setTimeout(() => spark.remove(), 400);
        }
    }

    function createHeart() {
        heartPool = heartPool.filter(h => h.parentNode);
        if (heartPool.length >= MAX_HEARTS) {
            const oldHeart = heartPool.shift();
            if (oldHeart.parentNode) oldHeart.remove();
        }

        const heart = document.createElement('div');
        heart.classList.add('heart');
        heart.innerHTML = '❤️';
        heart.style.left = Math.random() * 80 + 'vw';
        heart.style.fontSize = (Math.random() * 14 + 24) + 'px';
        const duration = Math.random() * 6 + 8;
        heart.style.animationDuration = duration + 's';
        heart.style.setProperty('--random-x', (Math.random() * 80 - 40) + 'px');
        heart.style.setProperty('--random-rot', (Math.random() * 60 - 30) + 'deg');

        let popped = false;

        function popHeart(e) {
            if (popped) return;
            popped = true;
            e.preventDefault();
            e.stopPropagation();
            const rect = heart.getBoundingClientRect();
            createExplosion(rect.left + rect.width / 2, rect.top + rect.height / 2);
            heart.style.opacity = '0';
            heart.style.transform = 'scale(1.5)';
            heart.style.transition = 'all 0.15s ease';
            setTimeout(() => {
                if (heart.parentNode) heart.remove();
                heartPool = heartPool.filter(h => h !== heart);
            }, 150);
            score++;
            scoreCount.innerText = score;
            scoreBox.classList.add('bump-animation');
            setTimeout(() => scoreBox.classList.remove('bump-animation'), 150);
        }

        heart.addEventListener('pointerdown', popHeart, { passive: false });
        heart.addEventListener('touchstart', popHeart, { passive: false });
        document.body.appendChild(heart);
        heartPool.push(heart);
        setTimeout(() => {
            if (!popped && heart.parentNode) {
                heart.remove();
                heartPool = heartPool.filter(h => h !== heart);
            }
        }, duration * 1000);
    }

    function startHearts() {
        if (heartInterval) clearInterval(heartInterval);
        heartInterval = setInterval(createHeart, 900);
    }

    function stopHearts() {
        if (heartInterval) clearInterval(heartInterval);
        heartPool.forEach(h => { if (h.parentNode) h.remove(); });
        heartPool = [];
    }

    function showLoveMessage() {
        const msg = loveMessages[Math.floor(Math.random() * loveMessages.length)];
        loveMessageEl.textContent = msg;
        loveMessageEl.classList.add('show');
        clearTimeout(messageTimeout);
        messageTimeout = setTimeout(() => loveMessageEl.classList.remove('show'), 5000);
    }

    function scheduleNextMessage() {
        const delay = Math.random() * 10000 + 15000;
        messageTimeout = setTimeout(() => {
            showLoveMessage();
            if (!audio.paused) scheduleNextMessage();
        }, delay);
    }

    function startLoveMessages() {
        clearTimeout(messageTimeout);
        messageTimeout = setTimeout(() => { showLoveMessage(); scheduleNextMessage(); }, 2000);
    }

    function stopLoveMessages() {
        clearTimeout(messageTimeout);
        loveMessageEl.classList.remove('show');
    }

    function playTrack() {
        if (currentTrackIndex < 0 || currentTrackIndex >= tracks.length) return;
        const playPromise = audio.play();
        if (playPromise !== undefined) {
            playPromise.then(() => {
                playBtn.innerText = '⏸';
                if (!audioContextInitialized) initAudioContext();
                renderVisualizer();
                startHearts();
                startLoveMessages();
            }).catch(error => {
                console.error('Ошибка воспроизведения:', error);
                playBtn.innerText = '▶';
            });
        }
    }

    function pauseTrack() {
        audio.pause();
        playBtn.innerText = '▶';
        resetVisualizerStyles();
        stopHearts();
        stopLoveMessages();
    }

    playBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (currentTrackIndex < 0) {
            if (tracks.length > 0) loadAndPlayTrack(0);
            return;
        }
        audio.paused ? playTrack() : pauseTrack();
    });

    prevBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (tracks.length === 0) return;
        let index = currentTrackIndex - 1;
        if (index < 0) index = tracks.length - 1;
        loadAndPlayTrack(index);
    });

    nextBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (tracks.length === 0) return;
        let index = currentTrackIndex + 1;
        if (index >= tracks.length) index = 0;
        loadAndPlayTrack(index);
    });

    audio.addEventListener('ended', () => {
        if (tracks.length === 0) return;
        let index = currentTrackIndex + 1;
        if (index >= tracks.length) index = 0;
        loadAndPlayTrack(index);
    });

    audio.addEventListener('timeupdate', () => {
        if (audio.duration) {
            progressBar.value = (audio.currentTime / audio.duration) * 100;
            let mins = Math.floor(audio.currentTime / 60);
            let secs = Math.floor(audio.currentTime % 60);
            timeCurrent.innerText = `${mins}:${secs < 10 ? '0' + secs : secs}`;
        }
    });

    progressBar.addEventListener('input', (e) => {
        e.stopPropagation();
        if (audio.duration) audio.currentTime = (progressBar.value / 100) * audio.duration;
    });

    volumeSlider.addEventListener('input', (e) => {
        e.stopPropagation();
        const vol = parseFloat(e.target.value);
        if (gainNode) gainNode.gain.value = vol;
        else audio.volume = vol;
    });

    createVisualizer();
    initPlaylist();
</script>
</body>
</html>
