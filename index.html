<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плейлист: Иришке</title>
    <style>
        body { background-color: #0c0205; color: #fff; font-family: sans-serif; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        /* КРАСИВЫЙ ПЛЕЕР (Ваш исходный дизайн) */
        .player-container { width: 100%; max-width: 390px; background-image: url('cover.jpg'); background-size: cover; border-radius: 25px; padding: 20px; border: 1px solid #ff4171; text-align: center; position: relative; overflow: hidden; }
        .player-overlay { position: absolute; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.6); z-index: 1; }
        .content { position: relative; z-index: 2; }
        
        .visualizer { display: flex; justify-content: center; gap: 5px; height: 30px; margin: 15px 0; align-items: flex-end; }
        .bar { width: 6px; background: #ff4171; border-radius: 3px; }
        
        .playlist { list-style: none; padding: 0; margin: 15px 0; text-align: left; }
        .track-item { padding: 8px; border-bottom: 1px solid #333; cursor: pointer; }

        /* ЗОНА ИГРЫ (внизу) */
        #game-area { width: 100%; max-width: 390px; flex-grow: 1; position: relative; margin-top: 20px; border-top: 2px solid #ff4171; }
        .heart { position: absolute; font-size: 30px; cursor: pointer; animation: flyUp 6s linear forwards; }
        @keyframes flyUp { from { bottom: 0; opacity: 1; } to { bottom: 100%; opacity: 0; } }
    </style>
</head>
<body>

<div class="player-container">
    <div class="player-overlay"></div>
    <div class="content">
        <h1>Иришке</h1>
        <h3 id="current-title">Заезженный диск</h3>
        <div class="visualizer" id="viz"></div>
        <button id="btn-play" style="padding:10px 30px; border-radius:20px; border:none; background:#ff4171; color:white; cursor:pointer;">▶ Play</button>
        <div style="margin-top:10px;">Сердечек: <span id="score">0</span></div>
        <ul class="playlist">
            <li class="track-item">1. Заезженный диск</li>
            <li class="track-item">2. Сумасшедший саксофон</li>
        </ul>
        <audio id="audio" src="track1.mp3"></audio>
    </div>
</div>

<div id="game-area"></div>

<script>
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('btn-play');
    const scoreEl = document.getElementById('score');
    const gameArea = document.getElementById('game-area');
    const viz = document.getElementById('viz');
    let score = 0;

    // Столбики эквалайзера
    for(let i=0; i<10; i++) {
        const bar = document.createElement('div');
        bar.className = 'bar';
        bar.style.height = '10px';
        viz.appendChild(bar);
    }

    playBtn.onclick = () => {
        if (audio.paused) {
            audio.play();
            playBtn.innerText = "⏸ Pause";
            setInterval(() => document.querySelectorAll('.bar').forEach(b => b.style.height = Math.random()*30 + 5 + 'px'), 200);
            setInterval(spawnHeart, 1000);
        } else {
            audio.pause();
            playBtn.innerText = "▶ Play";
        }
    };

    function spawnHeart() {
        const heart = document.createElement('div');
        heart.innerHTML = '❤️';
        heart.className = 'heart';
        heart.style.left = Math.random() * 80 + '%';
        heart.onclick = () => { score++; scoreEl.innerText = score; heart.remove(); };
        gameArea.appendChild(heart);
        setTimeout(() => heart.remove(), 6000);
    }
</script>
</body>
</html>
