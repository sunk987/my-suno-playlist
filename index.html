<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плейлист</title>
    <style>
        body {
            background-color: #0c0205;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
            font-family: sans-serif;
        }

        /* Упрощенный счетчик */
        #score-container {
            position: absolute;
            top: 20px;
            z-index: 100;
            background: rgba(255, 42, 95, 0.3);
            padding: 10px 20px;
            border-radius: 20px;
            pointer-events: none;
        }

        .player {
            width: 90%;
            max-width: 350px;
            background: #1a050b;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid #ff4171;
        }

        button { padding: 15px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div id="score-container">Сердечек: <span id="score">0</span></div>

<div class="player">
    <h2 id="title">Трек 1</h2>
    <button id="playBtn">▶ Play</button>
    <audio id="audio" src="track1.mp3"></audio>
</div>

<script>
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const scoreEl = document.getElementById('score');
    let score = 0;

    playBtn.onclick = () => {
        if (audio.paused) {
            audio.play();
            playBtn.innerText = "⏸ Pause";
        } else {
            audio.pause();
            playBtn.innerText = "▶ Play";
        }
    };

    // Простая проверка клика по всему экрану для сердечек
    document.body.onclick = (e) => {
        if(e.target !== playBtn) {
            score++;
            scoreEl.innerText = score;
        }
    };
</script>
</body>
</html>
