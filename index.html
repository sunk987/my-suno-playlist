<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плейлист: Иришке</title>
    <style>
        :root {
            --accent-color: #ff3366; /* Неоново-бордовый оттенок */
            --accent-glow: #ff003c;
            --text-color: #f8f9fa;
            --text-muted: #b3b9c9;
        }

        body {
            background-color: #050508;
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        /* Плеер с бордовой розой на заднем фоне */
        .player-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            border-radius: 30px;
            padding: 30px 25px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 51, 102, 0.15);
            overflow: hidden;
            background-image: url('https://images.unsplash.com/photo-1559564477-94185257b446?q=80&w=600&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }

        /* Затемнение поверх розы, чтобы текст и кнопки четко читались */
        .player-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.5) 0%, rgba(10, 2, 5, 0.85) 100%);
            z-index: 1;
        }

        /* Все элементы поднимаем над фоном */
        .header, .visualizer-area, .current-track-info, .progress-container, .controls, .volume-container, .playlist {
            position: relative;
            z-index: 2;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 34px;
            margin: 0 0 5px 0;
            background: linear-gradient(45deg, #ff5e7e, #ff003c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            text-shadow: 0 2px 10px rgba(255, 0, 60, 0.2);
        }

        .header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 13px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Компактный прозрачный эквалайзер */
        .visualizer-area {
            width: 100%;
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(5px);
        }

        .visualizer {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 50px;
            gap: 6px;
        }

        .bar {
            width: 5px;
            height: 6px;
            background-color: var(--accent-color);
            border-radius: 3px;
            transition: height 0.12s ease;
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.6);
        }

        .current-track-info {
            text-align: center;
            margin-bottom: 20px;
        }

        #current-title {
            font-size: 24px;
            font-weight: 700;
            margin: 0;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        /* Полоса прогресса */
        .progress-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
            font-size: 12px;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        .progress-bar-wrapper {
            flex-grow: 1;
            display: flex;
            align-items: center;
        }

        .progress-bar {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.1);
            height: 6px;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            box-shadow: 0 0 10px var(--accent-color);
        }

        /* Кнопки управления */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-bottom: 25px;
        }

        .btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 26px;
            transition: all 0.2s;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .btn:hover {
            color: var(--accent-color);
            transform: scale(1.15);
        }

        .btn-play {
            background: linear-gradient(135deg, #ff5e7e, #ff003c);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            box-shadow: 0 6px 20px rgba(255, 0, 60, 0.4);
            color: #fff;
        }

        .btn-play:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(255, 0, 60, 0.6);
        }

        /* Громкость */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 15px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .volume-slider {
            flex-grow: 1;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.1);
            height: 4px;
            border-radius: 2px;
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
        }

        /* Список треков */
        .playlist {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 200px;
            overflow-y: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 10px;
        }

        .track-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 6px;
            transition: all 0.2s;
            background-color: rgba(0, 0, 0, 0.15);
        }

        .track-item:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .track-item.active {
            background: linear-gradient(90deg, rgba(255, 51, 102, 0.25), transparent);
            border-left: 3px solid var(--accent-color);
        }

        .track-details h4 {
            margin: 0;
            font-size: 15px;
            font-weight: 500;
            color: #fff;
        }

        .track-duration {
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="player-container">
    <div class="header">
        <h1>Иришке</h1>
        <p>AleksLebed • Suno Playlist</p>
    </div>

    <div class="visualizer-area">
        <div class="visualizer" id="visualizer">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
    </div>

    <div class="current-track-info">
        <h3 id="current-title">Загрузка...</h3>
    </div>

    <audio id="audio-player" src=""></audio>

    <div class="progress-container">
        <span id="time-current">0:00</span>
        <div class="progress-bar-wrapper">
            <input type="range" class="progress-bar" id="progress" min="0" max="100" value="0">
        </div>
        <span id="time-duration">0:00</span>
    </div>

    <div class="controls">
        <button class="btn" id="btn-prev">⏮</button>
        <button class="btn btn-play" id="btn-play">▶</button>
        <button class="btn" id="btn-next">⏭</button>
    </div>

    <div class="volume-container">
        <span>🔈</span>
        <input type="range" class="volume-slider" id="volume" min="0" max="1" step="0.05" value="0.7">
        <span>🔊</span>
    </div>

    <ul class="playlist" id="playlist-container"></ul>
</div>
