<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плейлист: Иришке</title>
    <style>
        :root {
            --text-color: #ffffff;
            --text-muted: #cccccc;
        }

        body {
            background-color: #0c0205;
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }

        /* Главный контейнер плеера */
        .player-container {
            position: relative;
            width: 100%;
            max-width: 390px;
            height: 760px;
            border-radius: 30px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(255, 42, 95, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-color: #120307;
        }

        /* ВЕРХНЯЯ ЗОНА: Роза открыта и не загорожена кнопками */
        .cover-area {
            position: relative;
            width: 100%;
            height: 42%;
            background-image: url('cover.jpg');
            background-size: cover;
            background-position: center;
        }

        .cover-area::after {
            content: '';
            position: absolute;
            left: 0; bottom: 0; right: 0;
            height: 40px;
            background: linear-gradient(to top, rgba(12, 3, 7, 1), rgba(12, 3, 7, 0));
        }

        .header {
            position: absolute;
            top: 20px;
            left: 0; right: 0;
            text-align: center;
            z-index: 5;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        .header h1 {
            font-size: 28px;
            margin: 0 0 2px 0;
            color: #fff;
            font-weight: 800;
        }

        .header p {
            color: #eee;
            margin: 0;
            font-size: 12px;
            letter-spacing: 1px;
        }

        /* НИЖНЯЯ ЗОНА: Управление и разноцветный эквалайзер */
        .controls-area {
            width: 100%;
            height: 58%;
            padding: 15px 20px 20px 20px;
            box-sizing: border-box;
            background: #120307;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .current-track-info {
            text-align: center;
            margin-bottom: 5px;
        }

        #current-title {
            font-size: 20px;
            font-weight: 700;
            margin: 0;
            color: #fff;
        }

        /* ГОРИЗОНТАЛЬНЫЙ ЭКВАЛАЙЗЕР НА ВСЮ ШИРИНУ */
        .visualizer-area {
            width: 100%;
            height: 70px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 10px;
            box-sizing: border-box;
            margin: 10px 0;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .bar {
            flex-grow: 1;
            margin: 0 1px;
            height: 4px;
            border-radius: 2px 2px 0 0;
            transition: height 0.1s ease;
        }

        /* Кнопки под эквалайзером */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin: 5px 0 15px 0;
        }

        .btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 24px;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: scale(1.15);
        }

        .btn-play {
            background: linear-gradient(135deg, #ff4171, #d0003c);
            width: 54px;
            height: 54px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            box-shadow: 0 0 18px rgba(255, 42, 95, 0.5);
        }

        /* Тайм-линия */
        .progress-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            color: #aaa;
            margin-bottom: 10px;
        }

        .progress-bar-wrapper {
            flex-grow: 1;
            display: flex;
            align-items: center;
        }

        .progress-bar {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.1);
            height: 4px;
            border-radius: 2px;
            outline: none;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 6px #ff2a5f;
        }

        /* Громкость */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.03);
            padding: 6px 12px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .volume-slider {
            flex-grow: 1;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.1);
            height: 3px;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff2a5f;
        }

        /* Список песен */
        .playlist {
            list-style: none;
            padding: 0;
            margin: 0;
            height: 140px;
            overflow-y: auto
