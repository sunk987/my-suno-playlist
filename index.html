<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плейлист: Иришке</title>
    <style>
        body { background-color: #0c0205; color: #ffffff; font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 10px; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        .score-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(255, 42, 95, 0.2); border: 1px solid rgba(255, 42, 95, 0.4); padding: 8px 18px; border-radius: 20px; font-size: 14px; z-index: 9999; backdrop-filter: blur(5px); }

        .player-container { position: relative; width: 100%; max-width: 390px; background: #1a050a; border-radius: 25px; border: 1px solid rgba(255, 42, 95, 0.2); overflow: hidden; padding: 20px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .menu-icon { cursor: pointer; font-size: 24px; color: #ff4171; }

        .playlist-wrapper { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
        .playlist-wrapper.active { max-height: 200px; }
        
        .playlist { list-style: none; padding: 0; margin-top: 10px; }
        .track-item { padding: 8px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; background: rgba(255,255,255,0.05); font-size: 13px; }
        .track-item.active { background: rgba(255, 42, 95, 0.3); }

        /* Остальные стили (кнопки, визуализатор) остаются без изменений */
        .controls-area { display: flex; flex-direction: column; }
        .visualizer-area { width: 100%; height: 50px; display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 15px; }
        .bar { flex-grow: 1; margin: 0 1px; background: #ff4171; }
        .controls { display: flex; justify-content: center; gap: 20px; margin-bottom: 15px; }
        .btn-play { background: #ff4171; border-radius: 50%; width: 50px; height: 50px; border: none; color: white; cursor: pointer; }
    </style>
</head>
<body>

<div class="score-container">Поймано сердечек: <span id="score-count">0</span></div>

<div class="player-container">
    <div class="header">
        <div>
            <h1 style="font-size: 20px; margin:0;">Иришке</h1>
            <p style="font-size: 10px; margin:0; opacity: 0.7;">AleksLebed • Suno</p>
        </div>
        <div class="menu-icon" id="menu-toggle">☰</div>
    </div>

    <div class="controls-area">
        <h3 id="current-title" style="text-align: center;">Загрузка...</h3>
        <div class="visualizer-area" id="visualizer"></div>
        <div class="controls">
            <button class="btn" id="btn-prev">⏮</button>
            <button class="btn btn-play" id="btn-play">▶</button>
            <button class="btn" id="btn-next">⏭</button>
        </div>
        <audio id="audio-player" src=""></audio>
    </div>

    <div class="playlist-wrapper" id="playlist-wrapper">
        <ul class="playlist" id="playlist-container"></ul>
    </div>
</div>

<script>
    const tracks = [
        { id: 1, title: "Заезженный диск", file: "track1.mp3" },
        { id: 2, title: "сумасшедший саксофон", file: "track2.mp3" },
        { id: 3, title: "Девчонка с картинки", file: "track3.mp3" },
        { id: 4, title: "танцы на битом стекле", file: "track4.mp3" }
    ];

    const menuToggle = document.getElementById('menu-toggle');
    const playlistWrapper = document.getElementById('playlist-wrapper');
    const playlistContainer = document.getElementById('playlist-container');

    // Переключение меню
    menuToggle.addEventListener('click', () => {
        playlistWrapper.classList.toggle('active');
    });

    // Отрисовка списка
    tracks.forEach((track, index) => {
        const li = document.createElement('li');
        li.className = 'track-item';
        li.innerText = `${index + 1}. ${track.title}`;
        li.onclick = () => {
            // тут вызов вашей функции проигрывания
            console.log("Play:", track.file);
        };
        playlistContainer.appendChild(li);
    });
    
    // Остальной ваш JS-код (аудио, визуализатор и т.д.) остается прежним...
</script>
</body>
</html>
