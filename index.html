<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плейлист: Иришке</title>
    <style>
        body {
            background-color: #0c0205;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Главный контейнер плеера с розой на фоне */
        .player-container {
            position: relative;
            width: 100%;
            max-width: 390px;
            height: 720px; /* Фиксированная высота для баланса */
            border-radius: 30px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(255, 42, 95, 0.2);
            overflow: hidden;
            background-image: url('cover.jpg'); /* Ваша роза на весь фон */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
        }

        /* Красивое затемнение поверх розы для читаемости текста */
        .player-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, rgba(12, 3, 7, 0.3) 0%, rgba(12, 3, 7, 0.85) 100%);
            z-index: 1;
        }

        /* Поднимаем все элементы управления над фоном */
        .header, .controls-area {
            position: relative;
            z-index: 2;
        }

        /* Верхняя зона над розой */
        .header {
            text-align: center;
            padding: 25px 20px 10px 20px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        .header h1 {
            font-size: 30px;
            margin: 0 0 4px 0;
            color: #fff;
            font-weight: 800;
        }

        .header p {
            color: #eee;
            margin: 0;
            font-size: 13px;
            letter-spacing: 1px;
        }

        /* ЗОНА УПРАВЛЕНИЯ СНИЗУ */
        .controls-area {
            flex-grow: 1; /* Занимает все оставшееся пространство */
            padding: 15px 25px 25px 25px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Элементы прижаты к низу */
        }

        .current-track-info {
            text-align: center;
            margin-bottom: 10px;
        }

        #current-title {
            font-size: 21px;
            font-weight: 700;
            margin: 0;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.7);
        }

        /* ГОРИЗОНТАЛЬНЫЙ ЭКВАЛАЙЗЕР */
        .visualizer-area {
            width: 100%;
            height: 70px;
            background: rgba(0, 0, 0, 0.4); /* Полупрозрачный фон */
            border-radius: 16px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(5px); /* Легкое размытие под эквалайзером */
        }

        .bar {
            flex-grow: 1;
            margin: 0 1px;
            height: 5px;
            border-radius: 2.5px 2.5px 0 0;
            transition: height 0.1s ease;
        }

        /* Кнопки переключения */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-bottom: 20px;
        }

        .btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 26px;
            transition: transform 0.2s, color 0.2s;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .btn:hover {
            color: #ff2a5f;
            transform: scale(1.1);
        }

            background: linear-gradient(135deg, #ff4171, #d0003c);
            width: 58px;
            height: 58px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
