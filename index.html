<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плейлист: Иришке</title>
    <style>
        :root {
            --accent-color: #ff2a5f;
            --accent-glow: #ff003c;
            --text-color: #ffffff;
            --text-muted: #cccccc;
        }

        body {
            background-color: #0c0205;
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        /* Плеер с розой */
        .player-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            border-radius: 30px;
            padding: 30px 20px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(255, 42, 95, 0.2);
            overflow: hidden;
            background-image: url('rose.jpg');
            background-size: cover;
            background-position: center;
        }

        .player-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, rgba(12, 2, 5, 0.4) 0%, rgba(12, 2, 5, 0.9) 100%);
            z-index: 1;
        }

        .header, .center-area, .current-track-info, .progress-container, .volume-container, .playlist {
            position: relative;
            z-index: 2;
        }

        .header {
            text-align: center;
            margin-bottom: 15px;
        }

        .header h1 {
            font-size: 32px;
            margin: 0 0 4px 0;
            color: #fff;
            font-weight: 800;
            text-shadow: 0 2px 15px rgba(255, 42, 95, 0.6);
        }

        .header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 13px;
            letter-spacing: 1px;
        }

        /* Центральная зона с круговым эквалайзером */
        .center-area {
            width: 100%;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }

        .circle-visualizer-container {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Вращение всего эквалайзера при воспроизведении */
        .circle-visualizer {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.5s linear;
        }

        .playing .circle-visualizer {
            animation: rotateVisualizer 20s linear infinite;
        }

        @keyframes rotateVisualizer {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Лучи эквалайзера */
        .v-bar {
            position: absolute;
            bottom: 50%;
            width: 4px;
            height: 15px;
            background: linear-gradient(to top, var(--accent-color), #ff6b8b);
            border-radius: 2px;
            transform-origin: bottom center;
            transition: height 0.1s ease;
            box-shadow: 0 0 8px var(--accent-glow);
        }

        /* Главная кнопка управления внутри круга */
        .center-controls {
            position: absolute;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 22px;
            transition: transform 0.2s, color 0.2s;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }

        .btn:hover {
            color: var(--accent-color);
            transform: scale(1.15);
        }

        .btn-play {
            background: linear-gradient(135deg, #ff4171, #d0003c);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            box-shadow: 0 0 25px rgba(255, 42, 95, 0.6);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .btn-play:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(255, 42, 95, 0.9);
        }

        .current-track-info {
            text-align: center;
            margin-bottom: 15px;
        }

        #current-title {
            font-size: 22px;
            font-weight: 700;
            margin: 0;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        /* Полоса времени */
        .progress-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            font-size: 12px;
            color: #ddd;
        }

        .progress-bar-wrapper {
            flex-grow: 1;
            display: flex;
            align-items: center;
        }

        .progress-bar {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.15);
            height: 4px;
            border-radius: 2px;
            outline: none;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 8px var(--accent-color);
            cursor: pointer;
        }

        /* Громкость */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 15px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .volume-slider {
            flex-grow: 1;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.1);
            height: 4px;
            border-radius: 2px;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-color);
        }

        /* Список */
        .playlist {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 180px;
            overflow-y: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 10px;
        }

        .track-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 5px;
            background-color: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255,255,255,0.02);
        }

        .track-item.active {
            background: linear-gradient(90deg, rgba(255, 42, 95, 0.25), transparent);
            border-left: 3px solid var(--accent-color);
        }

        .track-details h4 {
            margin: 0;
            font-size: 14px;
            font-weight: 500;
        }

        .track-duration {
            font-size: 11px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="player-container" id="player-wrap">
    <div class="header">
        <h1>Иришке</h1>
        <p>AleksLebed • Suno Playlist</p>
    </div>

    <div class="center-area">
        <div class="circle-visualizer-container">
            <div class="circle-visualizer" id="visualizer"></div>
            <div class="center-controls">
                <button class="btn" id="btn-prev">⏮</button>
                <button class="btn btn-play" id="btn-play">▶</button>
                <button class="btn" id="btn-next">⏭</button>
            </div>
        </div>
    </div>

    <div class="current-track-info">
        <h3 id="current-title">Загрузка...</h3>
    </div>

    <audio id="audio-player" src=""></audio>

    <div class="progress-container">
        <span id="time-current">0:00</span>
        <div class="progress-bar-wrapper">
            <input type="range" class="progress-bar" id="progress" min="0" max="100" value="0">
        </div>
        <span id="time-duration">0:00</span>
    </div>

    <div class="volume-container">
        <span>🔈</span>
        <input type="range" class="volume-slider" id="volume" min="0" max="1" step="0.05" value="0.7">
        <span>🔊</span>
    </div>

    <ul class="playlist" id="playlist-container"></ul>
</div>

<script>
    const tracks = [
        { id: 1, title: "Заезженный диск", duration: "4:01", file: "track1.mp3" },
        { id: 2, title: "сумасшедший саксофон", duration: "4:39", file: "track2.mp3" },
        { id: 3, title: "Девчонка с картинки", duration: "3:53", file: "track3.mp3" },
        { id: 4, title: "танцы на битом стекле", duration: "3:12", file: "track4.mp3" }
    ];

    let currentTrackIndex = 0;
    let visualizerInterval;
    const numBars = 40; // Количество лучей в круге
    
    const playerWrap = document.getElementById('player-wrap');
    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('btn-play');
    const prevBtn = document.getElementById('btn-prev');
    const nextBtn = document.getElementById('btn-next');
    const volumeSlider = document.getElementById('volume');
    const progressBar = document.getElementById('progress');
    const playlistContainer = document.getElementById('playlist-container');
    const visualizer = document.getElementById('visualizer');
    const currentTitle = document.getElementById('current-title');
    const timeCurrent = document.getElementById('time-current');
    const timeDuration = document.getElementById('time-duration');

    // Генерируем лучи по кругу
    function createCircleVisualizer() {
        visualizer.innerHTML = '';
        for (let i = 0; i < numBars; i++) {
            const bar = document.createElement('div');
            bar.classList.add('v-bar');
            // Распределяем лучи равномерно на 360 градусов
            const angle = (i / numBars) * 360;
            // Сдвигаем от центра наружу на 50px (радиус внутреннего круга)
            bar.style.transform = `rotate(${angle}deg) translateY(-52px)`;
            visualizer.appendChild(bar);
        }
    }

    function initPlaylist() {
        playlistContainer.innerHTML = '';
        tracks.forEach((track, index) => {
            const li = document.createElement('li');
            li.classList.add('track-item');
            if(index === currentTrackIndex) li.classList.add('active');
            
            li.innerHTML = `
                <div class="track-details">
                    <h4>${index + 1}. ${track.title}</h4>
                </div>
                <div class="track-duration">${track.duration}</div>
            `;
            
            li.addEventListener('click', () => loadAndPlayTrack(index));
            playlistContainer.appendChild(li);
        });
        loadTrack(currentTrackIndex);
    }

    function loadTrack(index) {
        currentTrackIndex = index;
        audio.src = tracks[index].file;
        currentTitle.innerText = tracks[index].title;
        timeDuration.innerText = tracks[index].duration;
        timeCurrent.innerText = "0:00";
        progressBar.value = 0;
        
        document.querySelectorAll('.track-item').forEach((item, i) => {
            item.classList.toggle('active', i === index);
        });
        resetVisualizer();
    }

    function loadAndPlayTrack(index) {
        loadTrack(index);
        playTrack();
    }

    // Динамическая анимация кругового спектра
    function startVisualizer() {
        if (visualizerInterval) clearInterval(visualizerInterval);
        const bars = document.querySelectorAll('.v-bar');
        
        visualizerInterval = setInterval(() => {
            bars.forEach((bar, i) => {
                // Создаем красивую волну высоты
                const wave = Math.sin((i / numBars) * Math.PI * 4 + Date.now() / 200) * 10;
                const randomHeight = Math.floor(Math.random() * 25) + 10 + wave;
                bar.style.height = `${Math.max(6, randomHeight)}px`;
            });
        }, 90);
    }

    function resetVisualizer() {
        if (visualizerInterval) clearInterval(visualizerInterval);
        const bars = document.querySelectorAll('.v-bar');
        bars.forEach(bar => {
            bar.style.height = '6px';
        });
    }

    function playTrack() {
        audio.play().then(() => {
            playBtn.innerText = '⏸';
            playerWrap.classList.add('playing');
            startVisualizer();
        }).catch(err => {
            // Если файлов еще нет, всё равно запускаем анимацию для красоты теста
            playBtn.innerText = '⏸';
            playerWrap.classList.add('playing');
            startVisualizer();
        });
    }

    function pauseTrack() {
        audio.pause();
        playBtn.innerText = '▶';
        playerWrap.classList.remove('playing');
        resetVisualizer();
    }

    playBtn.addEventListener('click', () => {
        if (audio.paused && !playerWrap.classList.contains('playing')) playTrack(); else pauseTrack();
    });

    prevBtn.addEventListener('click', () => {
        let index = currentTrackIndex - 1;
        if (index < 0) index = tracks.length - 1;
        loadAndPlayTrack(index);
    });

    nextBtn.addEventListener('click', () => {
        let index = currentTrackIndex + 1;
        if (index >= tracks.length) index = 0;
        loadAndPlayTrack(index);
    });

    audio.addEventListener('ended', () => {
        nextBtn.click();
    });

    audio.addEventListener('timeupdate', () => {
        if (audio.duration) {
            const pos = (audio.currentTime / audio.duration) * 100;
            progressBar.value = pos;
            
            let mins = Math.floor(audio.currentTime / 60);
            let secs = Math.floor(audio.currentTime % 60);
            if (secs < 10) secs = '0' + secs;
            timeCurrent.innerText = `${mins}:${secs}`;
        }
    });

    progressBar.addEventListener('input', () => {
        if (audio.duration) {
            const newTime = (progressBar.value / 100) * audio.duration;
            audio.currentTime = newTime;
        }
    });

    volumeSlider.addEventListener('input', (e) => {
        audio.volume = e.target.value;
    });

    createCircleVisualizer();
    initPlaylist();
    audio.volume = volumeSlider.value;
</script>

</body>
</html>
