<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плейлист: Иришке</title>
    <style>
        body {
            background-color: #0c0205;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
        }

        /* ЖЕСТКО ЗАКРЕПИЛИ СЧЁТЧИК ВВЕРХУ ЭКРАНА */
        .score-container {
            position: fixed; 
            top: 20px;       
            left: 50%;
            transform: translateX(-50%) scale(1); 
            background: rgba(255, 42, 95, 0.2);
            border: 1px solid rgba(255, 42, 95, 0.4);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 15px rgba(255, 42, 95, 0.3);
            z-index: 9999; 
            display: flex;
            align-items: center;
            gap: 6px;
            user-select: none;
            transition: transform 0.1s ease, border-color 0.1s ease;
            backdrop-filter: blur(5px);
            
            /* Пропускает клики сквозь себя на плеер: */
            pointer-events: none; 
        }

        /* Анимация пульсации счётчика при поимке */
        .score-container.bump {
            transform: translateX(-50%) scale(1.15); 
            border-color: rgba(255, 42, 95, 0.9);
            background: rgba(255, 42, 95, 0.35);
        }

        #score-count {
            color: #ff4171;
            font-size: 18px;
            font-weight: 800;
            text-shadow: 0 0 8px rgba(255, 65, 113, 0.8);
        }

        /* Главный контейнер плеера */
        .player-container {
            position: relative;
            width: 100%;
            max-width: 390px;
            background-image: url('cover.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(255, 42, 95, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            z-index: 10;
            margin-top: 40px; 
        }

        /* Слой затемнения фона */
        .player-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, rgba(18, 3, 7, 0.4) 0%, rgba(18, 3, 7, 0.85) 100%);
            z-index: 1;
        }

        /* Все блоки внутри поднимаем над фоном */
        .header {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 25px 20px 10px 20px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
        }

        .header h1 {
            font-size: 28px;
            margin: 0 0 3px 0;
            color: #fff;
            font-weight: 800;
        }

        .header p {
            color: #dddddd;
            margin: 0;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .controls-area {
            position: relative;
            z-index: 2;
            padding: 10px 20px 20px 20px;
            display: flex;
            flex-direction: column;
        }

        .current-track-info {
            text-align: center;
            margin-bottom: 12px
