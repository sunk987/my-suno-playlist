<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плейлист: Меланхолия</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --container-bg: #14161d;
            --accent-color: #7209b7;
            --accent-glow: #3f37c9;
            --text-color: #f8f9fa;
            --text-muted: #6c757d;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .player-container {
            background-color: var(--container-bg);
            width: 100%;
            max-width: 480px;
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 26px;
            margin: 0 0 5px 0;
            background: linear-gradient(45deg, #7209b7, #f72585);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 14px;
            letter-spacing: 1px;
        }

        /* Визуализатор */
        .visualizer {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 35px;
            gap: 5px;
            margin-bottom: 20px;
        }

        .bar {
            width: 5px;
            height: 4px;
            background-color: var(--accent-color);
            border-radius: 3px;
            transition: height 0.2s ease;
        }

        .playing .bar {
            animation: bounce 0.8s ease infinite alternate;
        }

        .playing .bar:nth-child(1) { animation-duration: 0.3s; background-color: #f72585; }
        .playing .bar:nth-child(2) { animation-duration: 0.5s; background-color: #b5179e; }
        .playing .bar:nth-child(3) { animation-duration: 0.2s; background-color: #7209b7; }
        .playing .bar:nth-child(4) { animation-duration: 0.6s; background-color: #560bad; }
        .playing .bar:nth-child(5) { animation-duration: 0.4s; background-color: #3f37c9; }

        @keyframes bounce {
            0% { height: 4px; }
            100% { height: 35px; }
        }

        /* Инфо */
        .current-track-info {
            text-align: center;
            margin-bottom: 20px;
            min-height: 65px;
        }

        #current-title {
            font-size: 20px;
            font-weight: 600;
            margin: 0 0 6px 0;
            color: #fff;
        }

        #current-meta {
            color: var(--text-muted);
            font-size: 12px;
            margin: 0;
            line-height: 1.4;
            padding: 0 10px;
        }

        /* Прогресс-бар */
        .progress-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .progress-bar {
            flex-grow: 1;
            -webkit-appearance: none;
            background: #222533;
            height: 5px;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        .progress-bar::-webkit-slider-thumb {
