<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Иришке</title>
    <style>
        /* Главная настройка: колонка, а не центр */
        body { 
            background: #0c0205; 
            color: white; 
            font-family: sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column; /* ВАЖНО: элементы друг под другом */
            align-items: center; 
            min-height: 100vh; 
        }
        
        /* Плеер занимает мало места */
        .player-container { 
            width: 90%; 
            max-width: 390px; 
            background: #1a050b; 
            border: 1px solid #ff4171; 
            border-radius: 20px; 
            padding: 15px; 
            margin-top: 10px; 
            text-align: center; 
            flex-shrink: 0; /* Не дает плееру сжиматься */
        }
        
        .btn-play { background: #ff4171; border: none; padding: 10px 20px; border-radius: 20px; color: white; cursor: pointer; }
        
        /* Игровая зона занимает всё остальное место */
        #game-area { 
            width: 100%; 
            flex-grow: 1; /* Растягивается на остаток экрана */
            position: relative; 
            overflow: hidden; 
        }
        
        .heart { position: absolute; font-size: 30px; cursor: pointer; animation: flyUp 6s linear forwards; }
        @keyframes flyUp { from { bottom: 0; opacity: 1; } to { bottom: 100%; opacity: 0; } }
    </style>
</head>
<body>

<div class="player-container">
    <h3 style="margin:0;">Иришке</h3>
    <button class="btn-play" id="btn-play">▶ Play</button>
    <div style="margin-top:5px;">Сердечек: <span id="score">0</span></div>
    <audio id="audio" src="track1.mp3"></audio>
</div>

<div id="game-area"></div>

<script>
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('btn-play');
    const scoreEl = document.getElementById('score');
    const gameArea = document.getElementById('game-area');
    let score = 0;
    let gameInterval;

    playBtn.onclick = () => {
        if (audio.paused) {
            audio.play().catch(e => alert("Нажми Play!"));
            playBtn.innerText = "⏸ Pause";
            // Запускаем сердечки
            gameInterval = setInterval(spawnHeart, 800);
        } else {
            audio.pause();
            playBtn.innerText = "▶ Play";
            clearInterval(gameInterval);
        }
    };

    function spawnHeart() {
        const heart = document.createElement('div');
        heart.innerHTML = '❤️';
        heart.className = 'heart';
        heart.style.left = Math.random() * 80 + 'vw';
        heart.onclick = () => {
            score++;
            scoreEl.innerText = score;
            heart.remove();
        };
        gameArea.appendChild(heart);
        setTimeout(() => heart.remove(), 6000);
    }
</script>
</body>
</html>
